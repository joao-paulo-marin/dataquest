/* Completa dados antigos com campos novos do catálogo, sem sobrescrever o que existe. */
function migrateSlice(name, data) {
  const def = defaultState();
  if (name === 'core') {
    data.settings = Object.assign(defaultSettings(), data.settings || {});
    data.settings.pomodoro = Object.assign(defaultSettings().pomodoro, data.settings.pomodoro || {});
    data.settings.xp = Object.assign(defaultSettings().xp, data.settings.xp || {});
    data.settings.weekTemplate = Object.assign(defaultSettings().weekTemplate, data.settings.weekTemplate || {});
    for (const k of Object.keys(def.core)) if (data[k] === undefined) data[k] = def.core[k];
  }
  if (name === 'skills') {
    data.levels = data.levels || {}; data.initial = data.initial || {};
    SKILLS.forEach((s) => { if (data.levels[s.id] == null) data.levels[s.id] = s.i; if (data.initial[s.id] == null) data.initial[s.id] = s.i; });
    for (const k of ['history', 'evidences']) data[k] = data[k] || [];
    for (const k of ['assessed', 'review']) data[k] = data[k] || {};
  }
  if (name === 'library') {
    data.removed = data.removed || []; data.materials = data.materials || []; data.books = data.books || [];
    const have = new Set(data.materials.map((m) => m.id));
    def.library.materials.forEach((m) => { if (!have.has(m.id) && !data.removed.includes(m.id)) data.materials.push(m); });
  }
  if (name === 'cards') { data.decks = data.decks || []; data.cards = data.cards || []; data.log = data.log || {}; }
  if (['projects', 'notes', 'tasks'].includes(name)) data.list = data.list || [];
  return data;
}

function sliceData(name) {
  if (name.startsWith('sessions-')) { const y = +name.slice(9); return { list: S.sessions.filter((s) => new Date(s.start).getFullYear() === y) }; }
  return S[name];
}
function applySlice(name, data) {
  if (name.startsWith('sessions-')) {
    const y = +name.slice(9);
    S.sessions = S.sessions.filter((s) => new Date(s.start).getFullYear() !== y).concat(data.list || []);
    S.sessions.sort((a, b) => a.start - b.start);
  } else S[name] = migrateSlice(name, data);
}
function sessionYears() {
  return [...new Set([...(S.core.sessionYears || []), ...S.sessions.map((s) => new Date(s.start).getFullYear())])].sort();
}
function allSliceNames() { return [...SLICES, ...sessionYears().map((y) => 'sessions-' + y)]; }

function saveLocal(name) {
  if (!LS_OK) return;
  try { localStorage.setItem(LS_PREFIX + name, JSON.stringify({ u: META[name] || 0, d: sliceData(name) })); }
  catch (e) { console.warn('localStorage', e); if (e && e.name === 'QuotaExceededError') toast('O armazenamento do navegador está cheio. Exporte um backup em Configurações.', { type: 'warn' }); }
}
function loadLocal() {
  S = defaultState();
  try { localStorage.setItem(LS_PREFIX + 'probe', '1'); localStorage.removeItem(LS_PREFIX + 'probe'); }
  catch (e) { LS_OK = false; return; }
  for (const name of SLICES) {
    try {
      const raw = localStorage.getItem(LS_PREFIX + name);
      if (!raw) continue;
      const obj = JSON.parse(raw);
      if (obj && obj.d) { S[name] = migrateSlice(name, obj.d); META[name] = obj.u || 0; }
    } catch (e) { console.warn('slice inválida', name, e); }
  }
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(LS_PREFIX + 'sessions-')) continue;
    try { const obj = JSON.parse(localStorage.getItem(k)); const name = k.slice(LS_PREFIX.length); applySlice(name, obj.d || {}); META[name] = obj.u || 0; } catch (e) { console.warn(e); }
  }
}

/* commit: grava a(s) fatia(s) alterada(s), agenda a sincronização e redesenha. */
function commit(names, opts = {}) {
  names = Array.isArray(names) ? names : [names];
  const now = Date.now();
  for (const name of names) {
    if (name === 'sessions') {
      const years = sessionYears();
      S.core.sessionYears = years;
      for (const y of years) { META['sessions-' + y] = now; saveLocal('sessions-' + y); Sync.schedule('sessions-' + y); }
      META.core = now; saveLocal('core'); Sync.schedule('core');
    } else { META[name] = now; saveLocal(name); Sync.schedule(name); }
  }
  VERSION++;
  if (!opts.silent) { checkAchievements(); scheduleRender(); }
}

/* ---------- sincronização com a nuvem ----------
   Dois "backends" com a mesma interface (get/set por fatia):
   - claude: capability db do claude.ai, área privada data/users/<id>/
   - supabase: tabela dataquest_slices protegida por RLS (versão do GitHub Pages)
   Regras: BASE guarda a versão remota vista pela última vez em cada fatia.
   Remoto mudou e o local não  -> adota o remoto.
   Aparelho novo (nunca sincronizado) -> adota o remoto (sessões são mescladas).
   Os dois mudaram -> sessões são mescladas por id; nas demais fatias vence a mais recente. */
const BASE_PREFIX = LS_PREFIX + 'syncbase';
let BASE = {};
function loadBase(uid) {
  try {
    const raw = localStorage.getItem(BASE_PREFIX + ':' + uid) || (TARGET === 'claude' ? localStorage.getItem(BASE_PREFIX) : null);
    BASE = JSON.parse(raw || '{}') || {};
  } catch (e) { BASE = {}; }
}
function saveBase() { if (!Sync.uid) return; try { localStorage.setItem(BASE_PREFIX + ':' + Sync.uid, JSON.stringify(BASE)); } catch (e) { /* sem armazenamento */ } }

function claudeBackend(db, uid) {
  const col = db.collection('data/users/' + uid);
  return {
    kind: 'claude',
    async get(name) { const snap = await col.doc(name).get(); if (!snap.exists) return { exists: false }; const b = snap.data() || {}; return { exists: true, u: b.u || 0, d: b.d }; },
    async set(name, body) { await col.doc(name).set({ u: body.u, d: body.d, v: 1 }); },
  };
}
function supabaseBackend(client, uid) {
  const T = 'dataquest_slices';
  const wrap = (error) => {
    const msg = (error && error.message) || '';
    if (error && (error.code === '42501' || /permission denied|row-level security/i.test(msg))) return { code: 'denied', message: msg };
    if (error && (error.code === '42P01' || /does not exist|schema cache/i.test(msg))) return { code: 'missing', message: msg };
    if (/jwt|token|401/i.test(msg)) return { code: 'auth', message: msg };
    return { code: 'unavailable', message: msg };
  };
  return {
    kind: 'supabase',
    async get(name) {
      const { data, error } = await client.from(T).select('u,d').eq('user_id', uid).eq('slice', name).maybeSingle();
      if (error) throw wrap(error);
      return data ? { exists: true, u: Number(data.u) || 0, d: data.d } : { exists: false };
    },
    async set(name, body) {
      const { error } = await client.from(T).upsert({ user_id: uid, slice: name, u: body.u, d: body.d, updated_at: new Date().toISOString() }, { onConflict: 'user_id,slice' });
      if (error) throw wrap(error);
    },
  };
}
const SYNC_ERR = {
  denied: 'O Supabase recusou o acesso à tabela. Confira se o arquivo schema.sql foi executado por completo, inclusive o GRANT.',
  missing: 'A tabela dataquest_slices não existe no Supabase. Execute o arquivo schema.sql no SQL Editor do projeto.',
};

const Sync = {
  backend: null, client: null, uid: null, email: '', ready: false, state: 'local', msg: '', timers: {}, writing: {}, pending: {}, failedOnce: {}, visBound: false,
  set(state, msg = '') { this.state = state; this.msg = msg; renderSyncBadge(); },
  configured() { const c = window.DATAQUEST_CONFIG || {}; return TARGET === 'github' && !!(c.supabaseUrl && c.supabaseKey); },
  async init() {
    if (TARGET === 'github') return this.initSupabase();
    if (!(window.claude && typeof window.claude.use === 'function')) { this.set('local'); return; }
    this.set('connecting');
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { this.set('local'); return; }
      const id = await user.id();
      if (!id) { this.set('local'); return; }
      this.uid = id; this.backend = claudeBackend(db, id);
      await this.start();
    } catch (e) { console.warn('sync init', e); this.set('local'); }
  },
  async initSupabase() {
    if (!this.configured()) { this.set('local'); return; }
    if (!(window.supabase && window.supabase.createClient)) { this.set('offline', 'Não foi possível carregar a biblioteca de sincronização. Verifique a internet; o app continua funcionando neste aparelho.'); return; }
    const c = window.DATAQUEST_CONFIG;
    const key = String(c.supabaseKey);
    let role = '';
    try { role = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role || ''; } catch (e) { /* não é JWT (chave publishable) */ }
    if (key.startsWith('sb_secret_') || role === 'service_role') { this.set('error', 'O config.js está com a chave SECRETA do Supabase. Troque pela chave publishable (ou anon) e gere uma nova chave secreta no painel, porque a atual ficou exposta.'); return; }
    try {
      this.client = window.supabase.createClient(c.supabaseUrl, c.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      this.client.auth.onAuthStateChange((event, session) => { setTimeout(() => this.onAuth(event, session), 0); });
      const { data } = await this.client.auth.getSession();
      await this.onAuth('INITIAL', data && data.session);
    } catch (e) { console.warn('supabase init', e); this.set('offline', 'Não foi possível conectar ao Supabase agora. O app continua funcionando neste aparelho.'); }
  },
  async onAuth(event, session) {
    if (event === 'PASSWORD_RECOVERY' && typeof openNewPassword === 'function') openNewPassword();
    const user = session && session.user;
    if (user && user.id !== this.uid) {
      this.uid = user.id; this.email = user.email || '';
      this.backend = supabaseBackend(this.client, user.id);
      this.set('connecting');
      try { await this.start(); } catch (e) { console.warn(e); }
      scheduleRender();
    } else if (!user && (this.uid || event === 'INITIAL' || event === 'SIGNED_OUT')) {
      this.stop(); this.set('signedout'); scheduleRender();
    } else if (user) this.email = user.email || this.email;
  },
  async start() {
    loadBase(this.uid);
    this.ready = false;
    await this.pull();
    this.ready = true;
    for (const name of allSliceNames()) if ((META[name] || 0) > (BASE[name] || 0)) this.schedule(name, 300);
    if (!this.visBound) { this.visBound = true; document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.pull(); }); }
  },
  stop() { Object.values(this.timers).forEach((t) => t && clearTimeout(t)); this.timers = {}; this.backend = null; this.uid = null; this.email = ''; this.ready = false; },
  async pull() {
    if (!this.backend || this.pulling) return;
    this.pulling = true;
    let changed = false;
    try {
      for (const name of SLICES) changed = (await this.pullOne(name)) || changed;
      for (const y of sessionYears()) changed = (await this.pullOne('sessions-' + y)) || changed;
      if (!Object.values(this.writing).some(Boolean) && !Object.values(this.timers).some(Boolean)) this.set('synced');
      if (changed) {
        VERSION++; applyTheme(); scheduleRender();
        if (S.core.onboarded && typeof ONB_CLOSE === 'function') ONB_CLOSE();
        if (this.ready) toast('Dados atualizados com a sua conta.', { type: 'info', iconName: 'refresh' });
      }
    } catch (e) {
      console.warn('pull', e);
      if (e && SYNC_ERR[e.code]) this.set('error', SYNC_ERR[e.code]);
      else this.set('offline', 'Sem conexão com a sua conta agora. Tudo continua salvo neste navegador.');
    } finally { this.pulling = false; }
  },
  async pullOne(name) {
    const snap = await withTimeout(this.backend.get(name), 12000);
    const local = META[name] || 0, base = BASE[name] || 0;
    const isSessions = name.startsWith('sessions-');
    if (!snap.exists) { if (local > 0) this.schedule(name, 0); return false; }
    const u = snap.u || 0;
    if (typeof snap.d !== 'string') return false;
    if (u === base) { if (local > base) this.schedule(name, 0); return false; }
    const remoteData = JSON.parse(snap.d);
    const localChanged = local > base;
    if (isSessions && localChanged) {
      const mine = sliceData(name).list || [];
      const ids = new Set((remoteData.list || []).map((x) => x.id));
      const merged = (remoteData.list || []).concat(mine.filter((x) => !ids.has(x.id)));
      applySlice(name, { list: merged });
      BASE[name] = u; saveBase();
      if (merged.length !== (remoteData.list || []).length) { META[name] = Date.now(); this.schedule(name, 0); } else META[name] = u;
      saveLocal(name);
      return true;
    }
    if (!localChanged || base === 0 || u > local) {
      applySlice(name, remoteData); META[name] = u; BASE[name] = u; saveBase(); saveLocal(name);
      return true;
    }
    this.schedule(name, 0);
    return false;
  },
  schedule(name, delay = 1500) {
    if (!this.backend) return;
    clearTimeout(this.timers[name]);
    this.timers[name] = setTimeout(() => { this.timers[name] = null; this.push(name); }, delay);
    if (this.state !== 'error') this.set('saving');
  },
  async push(name) {
    if (!this.backend) return;
    if (!this.ready) { this.schedule(name, 1000); return; }
    if (this.writing[name]) { this.pending[name] = true; return; }
    this.writing[name] = true;
    const backend = this.backend;
    try {
      const u = META[name] || Date.now();

    for (let w = 0; w < 4; w++) { const c = windowDays(28).slice(w * 7, w * 7 + 7).filter(isActive).length; weekDays += c; if (c >= 3) weeks3++; }

    const consistency = Math.round(100 * (0.4 * Math.min(1, act30 / 20) + 0.4 * Math.min(1, min30 / (goal * 20)) + 0.2 * (weeks3 / 4)));

    const core = SKILLS.filter((s) => ['t1', 't2', 't3', 't4', 't5'].includes(s.t));
    const knowledge = Math.round(100 * sum(core, (s) => (lvl(s.id) - 1) / 5) / core.length);
    const developing = SKILLS.filter((s) => lvl(s.id) >= 2 && lvl(s.id) <= 4).length;
    const mastered = SKILLS.filter((s) => lvl(s.id) >= 5).length;
    const contents = Object.values(S.core.topics).filter((t) => t.s === 'done').length + sum(S.library.books, (b) => (b.chapters || []).filter((c) => c.doneAt).length) + sum(S.library.materials, (m) => (m.modules || []).filter((c) => c.doneAt).length) + S.library.materials.filter((m) => m.status === 'concluido').length;
    const assessments = S.skills.evidences.filter((e) => e.type === 'quiz' || e.type === 'revisao').length;
    const cs = cardStats();
    const needReview = SKILLS.filter((s) => skillState(s.id).state === 'review').length;

    const ex = sum(S.skills.evidences.filter((e) => e.type === 'exercicio'), (e) => e.qty || 1);
    const started = S.projects.list.filter((p) => ['andamento', 'concluido', 'publicado'].includes(p.status)).length;
    const done = S.projects.list.filter((p) => p.completedAt).length;
    const published = S.projects.list.filter((p) => p.status === 'publicado').length;
    const techs = [...new Set(S.projects.list.filter((p) => p.completedAt).flatMap((p) => p.techs || []))];
    const application = Math.round(100 * (0.3 * Math.min(1, ex / 60) + 0.4 * Math.min(1, done / 4) + 0.3 * Math.min(1, published / 3)));

    let insight = '';
    const parts = [['consistência', consistency], ['conhecimento', knowledge], ['aplicação prática', application]];
    const lo = parts.slice().sort((a, b) => a[1] - b[1])[0], hi = parts.slice().sort((a, b) => b[1] - a[1])[0];
    if (S.sessions.length === 0) insight = 'Seus indicadores começam a se mover com a primeira sessão registrada.';
    else if (hi[1] - lo[1] >= 25) {
      if (lo[0] === 'aplicação prática') insight = 'Você está estudando com regularidade, mas ainda tem pouca aplicação prática. Que tal registrar exercícios ou iniciar um projeto?';
      else if (lo[0] === 'consistência') insight = 'Você tem uma boa base, mas a frequência caiu. Sessões curtas de 20 minutos já mantêm o ritmo.';
      else insight = 'Você pratica bastante. Registre evidências e avalie suas habilidades para o conhecimento acompanhar.';
    } else insight = 'Suas três dimensões estão equilibradas. Continue alternando estudo, revisão e prática.';

    return {
      consistency: { score: consistency, act30, min30, goalHits, current: st.current, max: st.max, avg: act30 ? Math.round(min30 / act30) : 0, perWeek: weekDays / 4 },
      knowledge: { score: knowledge, developing, mastered, contents, assessments, accuracy: cs.accuracy, reviews30: cs.reviews30, needReview },
      application: { score: application, ex, started, done, published, techs },
      insight,
    };
  });
}

/* ---------- recomendações ---------- */
function daysSince(ts) { return ts ? daysBetween(new Date(ts), new Date()) : null; }
function studyText(skill, minutes) {
  if (minutes <= 20) return { title: `Revisar ${skill.n}`, how: 'Releia suas anotações e resolva 2 exercícios curtos.' };
  if (minutes <= 35) return { title: `Exercícios de ${skill.n}`, how: 'Resolva exercícios práticos do tema.' };
  return { title: `Estudar ${skill.n}`, how: 'Estude um conteúdo novo e resolva um exercício prático.' };
}
function recommend(minutes = 30, exclude = []) {
  const out = [];
  const cs = cardStats();
  const nd = notesDue();
  const X = set().xp;
  const xpFor = (m) => m * X.perMinute;
  if (cs.dueCount > 0) {
    const m = clamp(Math.ceil(cs.dueCount * 0.5), 5, Math.min(25, minutes));
    out.push({ kind: 'flash', score: 100 + Math.min(cs.dueCount, 40), title: `Revisar ${plural(cs.dueCount, 'flashcard pendente', 'flashcards pendentes')}`, reason: 'Revisões atrasadas vêm primeiro: é o que impede você de esquecer o que já estudou.', minutes: m, track: 'rev' });
  }
  if (nd.length) out.push({ kind: 'notes', score: 92 + nd.length, title: `Revisar ${plural(nd.length, 'conceito', 'conceitos')}`, reason: `${nd[0].concept} está com revisão marcada.`, minutes: clamp(nd.length * 4, 5, Math.min(20, minutes)), track: 'rev' });

  const now = Date.now();
  // avaliação de retenção (uma por vez)
  const assess = SKILLS.filter((s) => lvl(s.id) >= 3 && !S.skills.review[s.id]).map((s) => ({ s, last: S.skills.assessed[s.id] || S.core.createdAt })).filter((x) => now - x.last > 45 * DAY_MS).sort((a, b) => a.last - b.last)[0];
  if (assess && minutes >= 15) out.push({ kind: 'assess', score: 58, title: `Avaliar retenção: ${assess.s.n}`, reason: 'Faz mais de 45 dias que este nível não é verificado.', minutes: 15, track: assess.s.t, skill: assess.s.id });

  // estudo de tópicos
  const cands = [];
  for (const s of SKILLS) {
    if (exclude.includes(s.id)) continue;
    const st = skillState(s.id);
    if (!st.met || st.level >= 5 || topicStatus(s.id) === 'done') continue;
    const prio = TRACK[s.t].prio;
    const depList = (DEPENDENTS[s.id] || []).filter((d) => lvl(d) < PREREQ_MIN);
    const dependents = depList.length;
    const depWeight = Math.min(5, sum(depList, (d) => TRACK[SKILL[d].t].prio));
    const last = lastStudy((x) => x.topic === s.id);
    const trackLast = lastStudy((x) => x.track === s.t);
    const ds = daysSince(trackLast);
    let score = 40 * prio + depWeight * 4 + (5 - st.level) * 3;
    const nu = nextUnlock();
    const unlocks = nu && nu.missing.includes(s.id);
    if (unlocks) score += 12;
    if (topicStatus(s.id) === 'doing') score += 15;
    if (last && now - last < 7 * DAY_MS) score += 8;
    if (st.level >= 4) score -= 12;
    let reason = '';
    if (ds !== null && ds >= 10 && prio >= 0.85) { score += 10; reason = `Faz ${ds} dias que você não estuda ${TRACK[s.t].short}.`; }
    else if (topicStatus(s.id) === 'doing') reason = 'Você já começou este tema: continuar evita perder o fio.';
    else if (unlocks) reason = `Levar ${s.n} ao nível ${PREREQ_MIN} destrava ${nu.skill.n}.`;
    else if (dependents >= 2) reason = `É pré-requisito de ${dependents} habilidades que você ainda vai desenvolver.`;
    else if (st.level === 1 && prio >= 0.9) reason = `Lacuna em uma trilha prioritária (${TRACK[s.t].short}).`;
    else reason = `Próximo passo natural na trilha de ${TRACK[s.t].short}.`;
    cands.push({ s, score, reason });
  }
  cands.sort((a, b) => b.score - a.score);
  for (const c of cands.slice(0, 4)) {
    const m = Math.max(15, minutes);
    const t = studyText(c.s, minutes);
    out.push({ kind: 'study', score: c.score, title: t.title, how: t.how, reason: c.reason, minutes: m, track: c.s.t, skill: c.s.id });
  }
  // prática em projeto
  const proj = S.projects.list.find((p) => p.status === 'andamento');
  if (proj && minutes >= 45) out.push({ kind: 'project', score: 62, title: `Avançar no projeto: ${proj.name}`, reason: 'Aplicar o que estudou fixa o conhecimento e alimenta seu portfólio.', minutes, track: 'proj', project: proj.id });
  else if (!proj && minutes >= 50 && S.sessions.length >= 10) out.push({ kind: 'newproject', score: 45, title: 'Começar um projeto prático', reason: 'Você já tem horas de estudo; agora é hora de construir algo.', minutes, track: 'proj' });

  for (const r of out) r.xp = xpFor(Math.min(r.minutes, minutes));
  out.sort((a, b) => b.score - a.score);
  // com pouco tempo, priorize revisões; com bastante, garanta conteúdo novo entre as primeiras
  return out;
}

/* ---------- missão do dia ---------- */
function ensureMissions() {
  const k = todayKey();
  if (S.core.missions[k] && S.core.missions[k].main) return S.core.missions[k];
  const mm = set().missionMinutes || 30;
  const rec = recommend(mm).find((r) => r.kind === 'study' || r.kind === 'project') || recommend(mm)[0];
  const ms = { main: rec ? { title: rec.title, reason: rec.reason, how: rec.how || '', minutes: mm, track: rec.track, skill: rec.skill || '', kind: rec.kind, project: rec.project || '' } : null };
  const cs = cardStats();
  if (cs.dueCount > 0) ms.review = { target: Math.min(cs.dueCount, 20) };
  S.core.missions[k] = ms;
  // mantém só os últimos 400 dias de missões
  const keys = Object.keys(S.core.missions).sort();
  if (keys.length > 400) keys.slice(0, keys.length - 400).forEach((x) => delete S.core.missions[x]);
  commit('core', { silent: true });
  return ms;
}
function missionProgress(day = todayKey()) {
  const ms = S.core.missions[day];
  if (!ms || !ms.main) return { minutes: 0, pct: 0 };
  const m = sum(S.sessions.filter((s) => s.mission === day), sMin);
  return { minutes: m, pct: clamp(m / ms.main.minutes, 0, 1) };
}
function checkMissions() {
  const k = todayKey();
  const ms = S.core.missions[k];
  if (!ms) return false;
  let changed = false;
  if (ms.main && !ms.main.doneAt && missionProgress(k).minutes >= ms.main.minutes) { ms.main.doneAt = Date.now(); changed = true; toast(`Missão do dia concluída: +${set().xp.mission} XP`, { type: 'xp', title: 'Missão cumprida' }); }
  if (ms.review && !ms.review.doneAt) { const l = S.cards.log[k]; if (l && l.n >= ms.review.target) { ms.review.doneAt = Date.now(); changed = true; toast(`Revisão do dia concluída: +${set().xp.mission} XP`, { type: 'xp', title: 'Missão de revisão' }); } }
  return changed;
}

let achievementsBusy = false;
function checkAchievements() {
  if (achievementsBusy || !S) return;

  try {
    let changed = checkMissions();
    const prog = achievementProgress();
    for (const a of ACHIEVEMENTS) {
      if (S.core.achievements[a.id]) continue;
      const p = prog[a.id];
      if (p && p[0] >= p[1]) {

    const li = levelInfo();

}

/* ---------- resumos de período ---------- */
function rangeSessions(t0, t1) { return S.sessions.filter((s) => s.start >= t0 && s.start < t1); }
function byTrack(sessions) { const m = {}; for (const s of sessions) m[s.track || 'outro'] = (m[s.track || 'outro'] || 0) + sMin(s); return m; }
function periodSummary(t0, t1) {
  const ss = rangeSessions(t0, t1);
  const days = new Set(ss.map(sessionDay));
  const act = [...days].filter(isActive);
  let maxRun = 0, run = 0;
  for (let d = new Date(t0); d < new Date(t1); d = addDays(d, 1)) { if (isActive(dayKey(d))) { run++; maxRun = Math.max(maxRun, run); } else run = 0; }
  const inR = (ts) => ts && ts >= t0 && ts < t1;
  const levelUps = S.skills.history.filter((h) => inR(h.ts) && h.to > h.from);
  const ev = S.skills.evidences.filter((e) => inR(e.ts));
  const chapters = S.library.books.flatMap((b) => (b.chapters || []).filter((c) => inR(c.doneAt)).map((c) => ({ ...c, book: b.title })));
  const modules = S.library.materials.flatMap((m) => (m.modules || []).filter((c) => inR(c.doneAt)));
  const topicsDone = Object.entries(S.core.topics).filter(([, t]) => t.s === 'done' && inR(t.at)).map(([id]) => id);
  const cardsLog = Object.entries(S.cards.log).filter(([d]) => { const ts = parseDay(d).getTime(); return ts >= t0 && ts < t1; });
  const reviews = sum(cardsLog, ([, l]) => l.n || 0), ok = sum(cardsLog, ([, l]) => l.ok || 0);
  return {
    minutes: sum(ss, sMin), sessions: ss.length, activeDays: act.length, maxRun, tracks: byTrack(ss), levelUps, evidences: ev, chapters, modules, topicsDone,
    reviews, accuracy: reviews ? ok / reviews : null,
    projStarted: S.projects.list.filter((p) => inR(p.startedAt)), projDone: S.projects.list.filter((p) => inR(p.completedAt)), projPublished: S.projects.list.filter((p) => inR(p.publishedAt)),
    exercises: sum(ev.filter((e) => e.type === 'exercicio'), (e) => e.qty || 1), xp: sum(xpEvents().filter((e) => inR(e.ts)), (e) => e.amount),
    tasksDone: S.tasks.list.filter((t) => inR(t.doneAt)), tasksPlanned: S.tasks.list.filter((t) => { const ts = t.date ? parseDay(t.date).getTime() : 0; return ts >= t0 && ts < t1; }),
  };
}
function trackLabel(id) { return (TRACK[id] && TRACK[id].short) || 'Outro'; }
function topTracks(map, n = 3) { return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, n); }

/* Diagnóstico do mês: só afirma o que os dados sustentam. */
function monthDiagnosis(cur, prev, factor = 1) {
  const out = { attention: [], neglected: [], evolved: [], noEvidence: [], priorities: [] };
  const total = cur.minutes || 0;
  out.attention = topTracks(cur.tracks, 3).filter(([, m]) => m > 0);
  for (const t of TRACKS.filter((x) => x.prio >= 0.85)) {
    const m = cur.tracks[t.id] || 0;
    if (total >= 120 && m / total < 0.08) out.neglected.push(t);
  }
  const evolvedMap = {};
  cur.levelUps.forEach((h) => { const t = SKILL[h.skill].t; evolvedMap[t] = (evolvedMap[t] || 0) + (h.to - h.from); });
  cur.topicsDone.forEach((id) => { const t = SKILL[id].t; evolvedMap[t] = (evolvedMap[t] || 0) + 1; });
  out.evolved = Object.entries(evolvedMap).sort((a, b) => b[1] - a[1]).slice(0, 3);
  for (const [tid, m] of Object.entries(cur.tracks)) {
    if (!TRACK[tid] || !TRACKS.find((x) => x.id === tid) || m < 180) continue;
    const hasEv = cur.evidences.some((e) => (e.skills || []).some((sid) => SKILL[sid] && SKILL[sid].t === tid)) || cur.levelUps.some((h) => SKILL[h.skill].t === tid);
    if (!hasEv) out.noEvidence.push([tid, m]);
  }
  // prioridades sugeridas
  if (out.neglected.length && out.attention.length) {
    const [topId, topM] = out.attention[0];
    const ng = out.neglected[0];
    out.priorities.push(`Você investiu ${fmtHours(topM)} em ${trackLabel(topId)}, mas ${ng.short} recebeu ${fmtMin(cur.tracks[ng.id] || 0)}. Dedique duas sessões semanais a ${ng.short} no próximo mês.`);
  }
  if (out.noEvidence.length) out.priorities.push(`Registre evidências (exercícios, explicações ou código) de ${out.noEvidence.map(([t]) => trackLabel(t)).join(' e ')}: houve horas de estudo sem comprovação de domínio.`);
  if (cur.exercises === 0 && total >= 300) out.priorities.push('Nenhum exercício foi registrado no mês. Reserve uma sessão por semana só para prática.');
  if (cur.projStarted.length === 0 && S.projects.list.filter((p) => p.status === 'andamento').length === 0 && S.sessions.length >= 15) out.priorities.push('Comece um projeto prático: ele é a evidência mais forte para o seu portfólio.');
  const goalMin = (set().monthlyGoalH || 20) * 60;
  if (factor < 1) {
    const expected = goalMin * factor;
    if (total > 0 && total < expected * 0.6) out.priorities.push(`Você está abaixo do ritmo da meta mensal: ${fmtHours(total)} de ${fmtHours(expected)} esperadas até hoje. Sessões curtas em mais dias ajudam a recuperar sem sobrecarregar.`);
  } else {
    if (total < goalMin * 0.6 && total > 0) out.priorities.push(`Você ficou abaixo de 60% da meta mensal. Uma meta realista para o próximo mês é ${fmtHours(Math.max(total * 1.25, 300), 0)}.`);
    if (prev && prev.minutes && total > prev.minutes * 1.2) out.priorities.push('Seu volume cresceu bem em relação ao mês anterior. Mantenha o ritmo antes de aumentar a meta.');
  }
  if (!out.priorities.length && total > 0) out.priorities.push('Mantenha a distribuição atual e inclua uma revisão semanal de flashcards.');
  return out;
}

/* ---------- planejamento semanal ---------- */
function planNextWeek(weekStart) {
  const goal = set().dailyGoal || 60;
  const prevStart = addDays(weekStart, -7);
  const prevTasks = S.tasks.list.filter((t) => t.date && t.date >= dayKey(prevStart) && t.date < dayKey(weekStart));
  const rate = prevTasks.length ? prevTasks.filter((t) => t.done).length / prevTasks.length : null;
  const factor = rate === null ? 1 : rate < 0.4 ? 0.6 : rate < 0.7 ? 0.8 : 1;
  const cap = Math.round(goal * factor / 5) * 5 || 20;
  const pending = S.tasks.list.filter((t) => !t.done && t.date && t.date < dayKey(weekStart) && t.date >= dayKey(addDays(weekStart, -14)));
  const days = [...Array(7)].map((_, i) => ({ date: dayKey(addDays(weekStart, i)), load: 0, items: [] }));
  for (const d of days) d.load = sum(S.tasks.list.filter((t) => t.date === d.date && !t.done), (t) => t.duration || 0);
  const proposals = [];
  const overflow = [];
  const place = (p, preferIdx) => {
    const order = [preferIdx, ...days.map((_, i) => i).filter((i) => i !== preferIdx)];
    for (const i of order) { if (i === 6 && p.kind !== 'review') continue; if (days[i].load + p.duration <= cap) { days[i].load += p.duration; p.date = days[i].date; proposals.push(p); return true; } }
    overflow.push(p); return false;
  };
  pending.sort(by((t) => ({ alta: 0, media: 1, baixa: 2 }[t.priority] ?? 1))).forEach((t) => place({ kind: 'carry', taskId: t.id, title: t.title, track: t.track, duration: Math.min(t.duration || 30, cap), priority: t.priority || 'media', skill: t.skill || '' }, 0));
  const used = new Set();
  days.forEach((d, i) => {
    const wd = parseDay(d.date).getDay();
    const tid = set().weekTemplate[wd];
    if (!tid) return;
    if (tid === 'rev') { place({ kind: 'review', title: 'Revisão de flashcards e conceitos', track: 'rev', duration: Math.min(20, cap), priority: 'media' }, i); return; }
    if (tid === 'proj') { const pr = S.projects.list.find((p) => p.status === 'andamento'); place({ kind: 'project', title: pr ? `Projeto: ${pr.name}` : 'Projeto prático', track: 'proj', duration: cap, priority: 'media' }, i); return; }
    const sk = SKILLS.filter((s) => s.t === tid && !used.has(s.id) && skillState(s.id).met && topicStatus(s.id) !== 'done' && lvl(s.id) < 5)
      .sort((a, b) => (topicStatus(b.id) === 'doing') - (topicStatus(a.id) === 'doing') || lvl(a.id) - lvl(b.id))[0];
    if (sk) used.add(sk.id);
    place({ kind: 'study', title: sk ? `${TRACK[tid].short}: ${sk.n}` : `Estudo de ${TRACK[tid].short}`, track: tid, skill: sk ? sk.id : '', duration: cap, priority: TRACK[tid].prio >= 0.9 ? 'alta' : 'media' }, i);
  });

/* ---- charts.js ---- */
/* ==========================================================================
   DATAQUEST — gráficos em SVG (sem bibliotecas externas)
   ========================================================================== */

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

/* Moldura comum: o SVG desenha só a área do gráfico (escala livre) e os rótulos
   ficam em HTML, para o texto não esticar em telas estreitas. */
function chartBox(H, svgInner, yTicks, xLabels, aria, W) {
  const ys = yTicks.map((t) => `<span class="ch-y" style="top:${(t.y * 100).toFixed(2)}%">${esc(t.text)}</span>`).join('');
  const xs = xLabels.map((l) => `<span class="ch-x ${l.cls || ''}" style="left:${(l.x * 100).toFixed(2)}%">${esc(l.text)}</span>`).join('');
  return `<div class="chart-box" style="height:${H}px" role="img" aria-label="${esc(aria)}"><div class="ch-plot"><svg viewBox="0 0 ${W} 100" preserveAspectRatio="none" aria-hidden="true">${svgInner}</svg>${ys}${xs}</div></div>`;
}
function pickLabels(n, maxLabels) {
  const every = Math.max(1, Math.ceil(n / maxLabels));
  const idx = [];
  for (let i = 0; i < n; i += every) idx.push(i);
  if (idx[idx.length - 1] !== n - 1) { if (n - 1 - idx[idx.length - 1] < every / 2 && idx.length > 1) idx.pop(); idx.push(n - 1); }
  return idx;
}

/* Gráfico de barras verticais. data: [{label, value, color?, tip?}] */
function barChart(data, opts = {}) {
  if (!data.length || data.every((d) => !d.value)) return emptyChart(opts.empty);
  const W = 600, H = opts.height || 200;
  const max = niceMax(Math.max(...data.map((d) => d.value)));
  const fmt = opts.fmt || ((v) => nf(v, 1));
  const bw = W / data.length;
  let g = '';
  [0, 0.5, 1].forEach((t) => { const y = 100 - t * 100; g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="ch-grid"/>`; });
  data.forEach((d, i) => {
    const h = d.value > 0 ? Math.max(1.5, (d.value / max) * 100) : 0;
    const w = Math.min(bw * 0.64, 56);
    const x = i * bw + (bw - w) / 2;
    g += `<g class="ch-bar"><rect x="${i * bw}" y="0" width="${bw}" height="100" fill="transparent"/><rect x="${x}" y="${100 - h}" width="${w}" height="${h}" rx="3" fill="${d.color || opts.color || 'var(--primary)'}"/><title>${esc(d.tip || `${d.label}: ${fmt(d.value)}`)}</title></g>`;
  });
  const yTicks = [0, 0.5, 1].map((t) => ({ y: 1 - t, text: fmt(t * max) }));
  const xLabels = pickLabels(data.length, opts.maxLabels || 10).map((i) => ({ x: (i + 0.5) / data.length, text: data[i].label }));
  return chartBox(H, g, yTicks, xLabels, opts.aria || 'Gráfico de barras', W);
}

/* Linha com área. points: [{label, value}] */
function lineChart(points, opts = {}) {
  if (points.length < 2 || points.every((p) => !p.value)) return emptyChart(opts.empty);
  const W = 600, H = opts.height || 200;
  const max = niceMax(Math.max(...points.map((p) => p.value)));
  const fmt = opts.fmt || ((v) => nf(v));
  const X = (i) => (i / (points.length - 1)) * W;
  const Y = (v) => 100 - (v / max) * 100;
  const col = opts.color || 'var(--primary)';
  let g = '';
  [0, 0.5, 1].forEach((t) => { const y = Y(t * max); g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="ch-grid"/>`; });
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.value).toFixed(2)}`).join(' ');
  g += `<path d="${path} L${W},100 L0,100 Z" fill="${col}" opacity=".14"/>`;
  g += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  const band = W / (points.length - 1);
  points.forEach((p, i) => { g += `<rect class="ch-band" x="${Math.max(0, X(i) - band / 2)}" y="0" width="${band}" height="100" fill="transparent"><title>${esc(`${p.label}: ${fmt(p.value)}`)}</title></rect>`; });
  const yTicks = [0, 0.5, 1].map((t) => ({ y: 1 - t, text: fmt(t * max) }));
  const xLabels = pickLabels(points.length, opts.maxLabels || 6).map((i) => ({ x: i / (points.length - 1), text: points[i].label, cls: i === 0 ? 'first' : i === points.length - 1 ? 'last' : '' }));
  return chartBox(H, g, yTicks, xLabels, opts.aria || 'Gráfico de linha', W);
}

/* Rosca. segments: [{label, value, color}] */
function donutChart(segments, opts = {}) {
  const total = sum(segments, (s) => s.value);
  if (!total) return emptyChart(opts.empty);
  const R = 52, r = 34, C = 60;
  let a0 = -Math.PI / 2, g = '';
  const fmt = opts.fmt || ((v) => fmtMin(v));
  for (const s of segments.filter((x) => x.value > 0)) {
    const frac = s.value / total;
    const a1 = a0 + frac * Math.PI * 2 - (frac === 1 ? 0.0001 : 0);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rad, ang) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    g += `<path d="M${p(R, a0)} A${R},${R} 0 ${large} 1 ${p(R, a1)} L${p(r, a1)} A${r},${r} 0 ${large} 0 ${p(r, a0)} Z" fill="${s.color}"><title>${esc(`${s.label}: ${fmt(s.value)} (${nf(frac * 100)}%)`)}</title></path>`;
    a0 = a1;
  }
  const legend = segments.filter((x) => x.value > 0).sort((a, b) => b.value - a.value).map((s) => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${esc(fmt(s.value))}</b><em>${nf((s.value / total) * 100)}%</em></li>`).join('');
  return `<div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(opts.aria || 'Distribuição')}">${g}<text x="60" y="58" text-anchor="middle" class="donut-total">${esc(opts.center || fmtHours(total, 0))}</text><text x="60" y="74" text-anchor="middle" class="donut-sub">${esc(opts.centerSub || 'no período')}</text></svg><ul class="legend">${legend}</ul></div>`;
}

/* Barras horizontais em HTML (progresso de trilhas). */
function hBars(items) {
  return `<ul class="hbars">${items.map((it) => `<li><div class="hb-top"><span>${esc(it.label)}</span><b>${esc(it.right || '')}</b></div><div class="bar"><i style="width:${clamp(it.pct * 100, 0, 100)}%;background:${it.color || 'var(--primary)'}"></i></div></li>`).join('')}</ul>`;

function emptyChart(text) {

/* Anel de progresso (nível, meta diária, pomodoro). */
function ring(pct, { size = 64, stroke = 6, color = 'var(--primary)', track = 'var(--ring-track)', inner = '' } = {}) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;

/* ---------- calendário de contribuições ---------- */
function heatLevel(min) { return min <= 0 ? 0 : min < 20 ? 1 : min < 40 ? 2 : min < 60 ? 3 : 4; }

  const today = startOfDay(new Date());
  const windowStart = addDays(today, -364);
  const firstCol = addDays(windowStart, -windowStart.getDay()); // domingo
  const cols = Math.ceil((daysBetween(firstCol, today) + 1) / 7);
  const startCol = Math.max(0, cols - weeks);
  let cells = '', months = '', lastMonth = -1;
  for (let c = startCol; c < cols; c++) {
    const colStart = addDays(firstCol, c * 7);
    if (colStart.getMonth() !== lastMonth && colStart.getDate() <= 7) { months += `<span style="grid-column:${c - startCol + 1}">${MONTHS_SHORT[colStart.getMonth()]}</span>`; lastMonth = colStart.getMonth(); }
    for (let r = 0; r < 7; r++) {
      const d = addDays(colStart, r);
      if (d < windowStart || d > today) { cells += `<span class="hm-cell hm-void" style="grid-column:${c - startCol + 1};grid-row:${r + 1}"></span>`; continue; }
      const k = dayKey(d), info = dayMap()[k], min = info ? info.min : 0;
      cells += `<button type="button" class="hm-cell l${heatLevel(min)}${k === todayKey() ? ' today' : ''}" style="grid-column:${c - startCol + 1};grid-row:${r + 1}" data-act="day-detail" data-day="${k}" data-min="${min}" data-n="${info ? info.sessions : 0}" aria-label="${fmtDateLong(d)}: ${min} minutos"></button>`;
    }

  return `<div class="heatmap" data-scroll-end><div class="hm-inner" style="--cols:${n}">
    <div class="hm-months">${months}</div>
    <div class="hm-days"><span></span><span>Seg</span><span></span><span>Qua</span><span></span><span>Sex</span><span></span></div>
    <div class="hm-grid">${cells}</div></div></div>
    <div class="hm-legend"><span>Menos</span><i class="hm-cell l0"></i><i class="hm-cell l1"></i><i class="hm-cell l2"></i><i class="hm-cell l3"></i><i class="hm-cell l4"></i><span>Mais</span><span class="muted small hm-scale">1 a 19 min, 20 a 39, 40 a 59 e 60 ou mais</span></div>`;
}
function heatTooltip(cell) {

/* ---- v_pomodoro.js ---- */
/* ==========================================================================

   ========================================================================== */

const TIMER_KEY = LS_PREFIX + 'timer';
const MODES = { focus: 'Pomodoro', deep: 'Foco profundo', short: 'Sessão curta', custom: 'Personalizado', free: 'Livre' };

const Timer = {
  st: null,
  fresh() { return { phase: 'focus', status: 'idle', mode: 'focus', customMin: set().pomodoro.custom, plannedSec: set().pomodoro.focus * 60, accMs: 0, startedAt: 0, firstStart: 0, subject: '', topic: '', track: '', mission: '', task: '', project: '', cycle: 0 }; },
  load() { try { this.st = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null'); } catch (e) { this.st = null; } if (!this.st || !this.st.phase) this.st = this.fresh(); },
  save() { try { localStorage.setItem(TIMER_KEY, JSON.stringify(this.st)); } catch (e) { /* armazenamento indisponível: o cronômetro segue em memória */ } },
  modeMin(mode) { const p = set().pomodoro; return { focus: p.focus, deep: p.deep, short: p.short, custom: this.st.customMin || p.custom, free: 0 }[mode]; },
  elapsedMs() { const s = this.st; return s.accMs + (s.status === 'running' ? Date.now() - s.startedAt : 0); },
  remainingSec() { return this.st.plannedSec ? Math.max(0, this.st.plannedSec - this.elapsedMs() / 1000) : 0; },
  isBreak() { return this.st.phase !== 'focus'; },
  busy() { return this.st.phase === 'focus' && this.st.status !== 'idle'; },
  setMode(mode) {
    if (this.st.status !== 'idle') return;
    this.st.mode = mode; this.st.phase = 'focus';
    this.st.plannedSec = this.modeMin(mode) * 60;
    this.save();
  },
  preset({ subject = '', topic = '', track = '', minutes = 25, mission = '', task = '', project = '' }) {
    if (this.busy()) { toast('Já existe uma sessão em andamento. Finalize-a antes de começar outra.', { type: 'warn' }); return; }
    if (this.isBreak()) this.toFocus(false);
    const p = set().pomodoro;
    const mode = minutes === p.focus ? 'focus' : minutes === p.deep ? 'deep' : minutes === p.short ? 'short' : 'custom';
    Object.assign(this.st, { subject, topic, track, mission, task, project, mode, customMin: mode === 'custom' ? minutes : this.st.customMin });
    this.st.plannedSec = this.modeMin(mode) * 60;
    this.save();
  },
  start() {
    const s = this.st;
    if (s.status === 'running') return;
    if (s.phase === 'focus' && !s.topic && !s.track) { toast('Escolha o assunto da sessão antes de começar.', { type: 'warn' }); const el = $('#tm-subject'); if (el) el.focus(); return; }
    if (s.status === 'idle') { s.firstStart = Date.now(); s.accMs = 0; if (s.mode !== 'free' && s.phase === 'focus') s.plannedSec = this.modeMin(s.mode) * 60; }
    s.startedAt = Date.now(); s.status = 'running';
    this.save(); Sound.unlock(); this.tick(true); renderTimerUI();
  },
  pause() { const s = this.st; if (s.status !== 'running') return; s.accMs += Date.now() - s.startedAt; s.status = 'paused'; this.save(); renderTimerUI(); },
  resume() { const s = this.st; if (s.status !== 'paused') return; s.startedAt = Date.now(); s.status = 'running'; this.save(); renderTimerUI(); },
  /* Finalizar: registra só o tempo efetivo (pausas não contam). */
  finish() {
    const s = this.st;
    if (s.phase !== 'focus') { this.toFocus(false); return; }
    if (s.status === 'idle') return;
    const sec = Math.floor(this.elapsedMs() / 1000);
    const completed = s.plannedSec > 0 && sec >= s.plannedSec;

  cancel() { this.reset(); toast('Sessão descartada. Nenhum tempo foi registrado.', { type: 'info' }); },
  reset() { const keep = { mode: this.st.mode, customMin: this.st.customMin, cycle: this.st.cycle }; this.st = Object.assign(this.fresh(), keep); this.st.plannedSec = this.modeMin(this.st.mode) * 60; this.save(); renderTimerUI(); },
  complete(quiet) {

    this.st = Object.assign(this.fresh(), keep, { phase: long ? 'long' : 'short', plannedSec: (long ? p.longBreak : p.shortBreak) * 60 });

  toFocus(notifyUser) {

  record(sec, status, endTs, quiet) {

  tick(force) {

    if (force) renderTimerUI();
  },
};

function saveSession(session, quiet) {
  S.sessions.push(session);
  S.sessions.sort((a, b) => a.start - b.start);
  const names = ['sessions'];
  if (session.topic && topicStatus(session.topic) === 'todo') { S.core.topics[session.topic] = { s: 'doing', at: Date.now() }; }
  if (session.task) {
    const t = S.tasks.list.find((x) => x.id === session.task);
    if (t && !t.done) {
      const m = sum(S.sessions.filter((x) => x.task === t.id), sMin);
      if (m >= (t.duration || 30) * 0.8) { t.done = true; t.doneAt = Date.now(); names.push('tasks'); toast(`Tarefa concluída: ${t.title}`, { type: 'success' }); }
    }
  }
  commit(names);
  if (!quiet) toast(`${fmtMin(sMin(session))} registrados: +${nf(sMin(session) * set().xp.perMinute)} XP`, { type: 'xp', title: session.status === 'interrupted' ? 'Sessão finalizada' : 'Sessão concluída' });
}

/* ---------- som e notificações ---------- */
const Sound = {
  ctx: null, noise: null, gain: null,
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { /* áudio indisponível */ } },
  chime(soft) {
    if (!set().sound) return;
    this.unlock(); if (!this.ctx) return;
    const t = this.ctx.currentTime;
    (soft ? [660, 880] : [523.25, 659.25, 783.99]).forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.18); g.gain.exponentialRampToValueAtTime(0.18, t + i * 0.18 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.9);
      o.connect(g).connect(this.ctx.destination); o.start(t + i * 0.18); o.stop(t + i * 0.18 + 1);
    });
  },
  ambientOn(kind = set().ambient || 'brown') {
    this.unlock(); if (!this.ctx) return false;
    this.ambientOff();
    const len = this.ctx.sampleRate * 4, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w * 0.35; }
    const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = kind === 'brown' ? 900 : 1600;
    const g = this.ctx.createGain(); g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(kind === 'brown' ? 0.5 : 0.12, this.ctx.currentTime + 1.2);
    src.connect(filt).connect(g).connect(this.ctx.destination); src.start();
    this.noise = src; this.gain = g; return true;
  },
  ambientOff() { try { if (this.noise) { this.noise.stop(); this.noise.disconnect(); } } catch (e) { /* já parado */ } this.noise = null; },
  get ambientPlaying() { return !!this.noise; },
};
function notify(title, body) {
  try { if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') new Notification(title, { body }); } catch (e) { /* notificações bloqueadas neste ambiente */ }
}

/* ---------- interface ---------- */
function timerParts() {
  const s = Timer.st;
  const free = s.mode === 'free' && s.phase === 'focus';
  const shown = free ? Timer.elapsedMs() / 1000 : (s.status === 'idle' && s.phase === 'focus' ? Timer.modeMin(s.mode) * 60 : Timer.remainingSec());
  const pct = free ? (Timer.elapsedMs() / 1000 % 3600) / 3600 : s.plannedSec ? 1 - Timer.remainingSec() / s.plannedSec : 0;
  const phaseName = s.phase === 'focus' ? (s.status === 'idle' ? 'Pronto para começar' : s.status === 'paused' ? 'Pausado' : 'Foco') : s.phase === 'long' ? 'Pausa longa' : 'Pausa curta';
  return { shown, pct: s.status === 'idle' && s.phase === 'focus' ? 0 : pct, phaseName };
}
function updateTimerDom() {
  const p = timerParts(), s = Timer.st;
  const clock = fmtClock(p.shown);
  for (const el of $$('[data-tm="clock"]')) el.textContent = clock;
  for (const el of $$('[data-tm="phase"]')) el.textContent = p.phaseName;
  for (const el of $$('[data-tm="ring"]')) { const c = +el.getAttribute('stroke-dasharray'); el.setAttribute('stroke-dashoffset', c * (1 - clamp(p.pct, 0, 1))); }
  for (const el of $$('[data-tm="bar"]')) el.style.width = clamp(p.pct * 100, 0, 100) + '%';
  for (const el of $$('[data-tm="now"]')) el.textContent = fmtTime(Date.now());
  document.title = s.status === 'running' ? `${clock} · ${s.phase === 'focus' ? 'Foco' : 'Pausa'} | DATAQUEST` : 'DATAQUEST';
  for (const id of ['#timer-pill', '#timer-pill-d']) {
    const pill = $(id); if (!pill) continue;
    pill.hidden = s.status === 'idle' || (id === '#timer-pill-d' && CURRENT === 'pomodoro');
    pill.querySelector('b').textContent = clock;
    pill.classList.toggle('is-break', s.phase !== 'focus');
  }
}
function renderTimerUI() {
  if (CURRENT === 'pomodoro') { const box = $('#tm-main'); if (box) box.innerHTML = timerMain(); }
  if ($('#focus').classList.contains('open')) renderFocus();
  updateTimerDom();
}
function bigRing() {
  const size = 280, stroke = 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const p = timerParts(), s = Timer.st;

  return `<div class="tm-ring"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/><circle data-tm="ring" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p.pct)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>
    <div class="tm-ring-in"><span class="tm-phase" data-tm="phase">${esc(p.phaseName)}</span><strong class="tm-clock" data-tm="clock">${fmtClock(p.shown)}</strong><span class="tm-cycle">${[1, 2, 3, 4].map((i) => `<i class="${((s.cycle || 0) % (set().pomodoro.longEvery || 4)) >= i ? 'on' : ''}"></i>`).join('')}</span></div></div>`;
}

  return `<div class="tm-controls">${s.status === 'running' ? `<button class="btn btn-secondary btn-lg" data-act="tm-pause">${icon('pause')}Pausar</button>` : `<button class="btn btn-primary btn-lg" data-act="tm-resume">${icon('play')}Retomar</button>`}<button class="btn btn-ghost btn-lg" data-act="tm-finish">${icon('stop')}Finalizar e registrar</button><button class="btn btn-ghost btn-lg" data-act="tm-focus">${icon('max')}Modo foco</button><button class="btn btn-text" data-act="tm-cancel">Descartar</button></div>`;

function timerMain() {

    <div class="seg ${idle ? '' : 'is-locked'}" role="tablist" aria-label="Modo do cronômetro">${modes.map(([m, sub]) => `<button type="button" role="tab" aria-selected="${s.mode === m}" class="${s.mode === m ? 'on' : ''}" data-act="tm-mode" data-mode="${m}" ${idle ? '' : 'disabled'}><b>${MODES[m]}</b><span>${sub}</span></button>`).join('')}</div>

      <label class="field"><span>O que você vai fazer (opcional)</span><input class="input" id="tm-desc" value="${esc(s.subject)}" placeholder="Ex.: exercícios de window functions" data-change="tm-desc" maxlength="120" ${s.phase !== 'focus' ? 'disabled' : ''}></label>
      ${linked.length ? `<div class="chips">${linked.map((l) => `<span class="chip">${l}</span>`).join('')}${idle ? '<button class="btn btn-text btn-sm" data-act="tm-unlink">Desvincular</button>' : ''}</div>` : ''}
    </div>

function sessionRow(s) {

  const minutes = parseInt(d.minutes, 10);
  const start = new Date(`${d.date}T${d.time}`);
  const end = new Date(start.getTime() + minutes * 60e3);
  const err = (m) => toast(m, { type: 'error' });
  if (!d.subjectSel) return err('Escolha o assunto da sessão.');
  if (!(minutes >= 1 && minutes <= 240)) return err('A duração precisa ficar entre 1 e 240 minutos.');
  if (isNaN(start)) return err('Data ou horário inválido.');

  saveSession({ id: uid('s'), start: start.getTime(), end: end.getTime(), sec: minutes * 60, topic: sub.topic, track: sub.track, subject: d.subject, mode: 'manual', status: 'completed', manual: true, mission: '', task: '', project: '' });

  if (today > 0) return `Mais ${fmtMin(goal - today)} e você alcança sua meta diária.`;
  if (st.current > 0) return `Sua sequência está em ${plural(st.current, 'dia', 'dias')}. Uma sessão de ${set().minDayMinutes} minutos hoje mantém o ritmo.`;
  if (st.max > 0) return 'Retome hoje: uma sessão curta já recomeça sua sequência.';

    <h2 class="report-h">Aplicação</h2>
    <div class="kpi-strip">
      ${kpi('Projetos iniciados', nf(cur.projStarted.length), '', 'hammer')}
      ${kpi('Projetos concluídos', nf(cur.projDone.length), '', 'rocket')}
      ${kpi('Projetos publicados', nf(cur.projPublished.length), '', 'github')}
      ${kpi('Exercícios realizados', nf(cur.exercises), techs.length ? `Tecnologias: ${techs.slice(0, 4).map(esc).join(', ')}` : '', 'keyboard')}
    </div>
    <div class="grid-2">
      ${panel('Horas por mês', barChart(months, { fmt: (v) => nf(v, 1) + ' h', color: 'var(--primary)', height: 180 }))}
      ${panel('Onde foi o seu tempo', donutChart(Object.entries(cur.tracks).map(([id, m]) => ({ label: trackLabel(id), value: m, color: (TRACK[id] || TRACK.outro).color })), { center: fmtHours(cur.minutes, 0), centerSub: 'no mês' }))}

      ${q('Quais assuntos receberam mais atenção?', diag.attention.length ? diag.attention.map(([id, m]) => `${esc(trackLabel(id))} (${fmtMin(m)})`).join(', ') : '<span class="muted">Sem sessões no mês.</span>')}
      ${q('Quais competências ficaram negligenciadas?', diag.neglected.length ? diag.neglected.map((t) => esc(t.short)).join(', ') : '<span class="muted">Nenhuma trilha prioritária ficou abaixo de 8% do tempo.</span>')}
      ${q('Quais trilhas evoluíram mais?', diag.evolved.length ? diag.evolved.map(([t, n]) => `${esc(trackLabel(t))} (${plural(n, 'avanço', 'avanços')})`).join(', ') : '<span class="muted">Nenhuma mudança de nível ou tópico concluído no mês.</span>')}
      ${q('Onde houve tempo sem evidência de domínio?', diag.noEvidence.length ? diag.noEvidence.map(([t, m]) => `${esc(trackLabel(t))} (${fmtHours(m)} sem evidência)`).join(', ') : '<span class="muted">Nada a apontar: as trilhas com 3h ou mais tiveram evidências.</span>')}
    </div>
    ${panel('Prioridades para o próximo mês', `<ul class="reco-list">${diag.priorities.map((p) => `<li>${icon('flag')}<span>${esc(p)}</span></li>`).join('') || '<li class="muted">Registre sessões para receber recomendações.</li>'}</ul>`, { sub: 'Geradas a partir dos seus registros. Nada aqui é inventado.' })}
  </section>`;
}
act('month-nav', (el) => { MONTH_OFFSET = Math.min(0, MONTH_OFFSET + +el.dataset.d); renderView(); });
act('month-export', () => {
  const { start, cur, prev } = monthData(MONTH_OFFSET);

  <h2>Conhecimento</h2><table>${row('Habilidades que evoluíram', nf(new Set(cur.levelUps.map((h) => h.skill)).size))}${row('Tópicos concluídos', nf(cur.topicsDone.length))}${row('Capítulos lidos', nf(cur.chapters.length))}${row('Flashcards revisados', nf(cur.reviews))}${row('Taxa de acerto', cur.accuracy == null ? 'sem revisões' : nf(cur.accuracy * 100) + '%')}</table>
  <h2>Aplicação</h2><table>${row('Projetos iniciados', nf(cur.projStarted.length))}${row('Projetos concluídos', nf(cur.projDone.length))}${row('Projetos publicados', nf(cur.projPublished.length))}${row('Exercícios', nf(cur.exercises))}</table>
  <h2>Tempo por assunto</h2><table>${Object.entries(cur.tracks).sort((a, b) => b[1] - a[1]).map(([id, m]) => row(trackLabel(id), fmtMin(m))).join('')}</table>
  <h2>Prioridades para o próximo mês</h2><ul>${d.priorities.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></body></html>`;
  saveFile(`dataquest-${start.getFullYear()}-${pad(start.getMonth() + 1)}.html`, html);

function levelsTab() {
  const li = levelInfo();

  for (const e of ev) { acc += e.amount; byDay[dayKey(new Date(e.ts))] = acc; }

    ${panel('Caminho de níveis', `<ol class="levels">${LEVELS.map((l) => `<li class="${l.lv < li.lv ? 'past' : l.lv === li.lv ? 'now' : ''}"><span class="lv-dot">${l.lv}</span><div><b>${esc(l.n)}</b><span class="muted small">${nf(l.xp)} XP</span></div>${l.lv === li.lv ? `<em class="chip chip-primary">Você está aqui</em>` : l.lv < li.lv ? icon('check') : ''}</li>`).join('')}</ol>`)}
    <div class="stack">
      ${panel('Evolução do XP', lineChart(pts, { fmt: (v) => nf(v), empty: 'O gráfico aparece depois das primeiras sessões.' }))}
      ${panel('Como ganhar XP', `<ul class="list-plain">${[['1 minuto de estudo', set().xp.perMinute], ['Missão diária concluída', set().xp.mission], ['Capítulo de livro concluído', set().xp.chapter], ['Módulo de curso concluído', set().xp.module], ['Projeto concluído', set().xp.project], ['Semana com 5 dias de estudo', set().xp.week5]].map(([a, b]) => `<li><span>${a}</span><b>${nf(b)} XP</b></li>`).join('')}</ul><p class="muted small">Cada conclusão gera XP uma única vez. Abrir o app não dá XP, e tempo só conta quando é estudado.</p>`)}

/* ---- v_plan.js ---- */
/* ==========================================================================
   DATAQUEST — Plano de Estudos (trilhas + planejador)
   ========================================================================== */

let PLAN_TAB = 'trilhas';
let PLAN_WEEK = 0;
let PLAN_MONTH = 0;
const PLAN_OPEN = new Set(['t2']);
const PRIO = { alta: { n: 'Alta', c: 'var(--danger)' }, media: { n: 'Média', c: 'var(--warning)' }, baixa: { n: 'Baixa', c: 'var(--muted)' } };
act('plan-tab', (el) => { PLAN_TAB = el.dataset.tab; renderView(); });

function prioLabel(p) { return p >= 0.85 ? '<span class="chip chip-primary">Prioritária</span>' : p >= 0.45 ? '<span class="chip">Complementar</span>' : '<span class="chip">Especialização</span>'; }
function topicSuggestion(s) {
  const st = topicStatus(s.id), l = lvl(s.id);
  if (st !== 'done' && l >= 4) return 'Seu nível é 4 ou mais: talvez já possa marcar como concluído.';
  if (st === 'done' && l <= 2) return 'Concluído, mas com nível baixo: considere revisar.';
  return '';
}
function topicRow(s) {
  const ss = skillState(s.id), st = topicStatus(s.id), sug = topicSuggestion(s);
  return `<li class="topic ${ss.state === 'locked' ? 'is-locked' : ''}">
    <button class="topic-name" data-act="open-skill" data-id="${s.id}">${ss.state === 'locked' ? icon('lock') : ''}<span>${esc(s.n)}</span></button>
    ${pips(ss.level)}
    <select class="input input-sm topic-status st-${st}" data-change="topic-status" data-id="${s.id}" aria-label="Status de ${esc(s.n)}">${Object.entries(TOPIC_LABEL).map(([k, v]) => `<option value="${k}" ${k === st ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <button class="icon-btn" data-act="study-skill" data-id="${s.id}" ${ss.state === 'locked' ? 'disabled title="Desenvolva os pré-requisitos primeiro"' : 'title="Estudar agora"'} aria-label="Estudar ${esc(s.n)}">${icon('play')}</button>
    ${sug ? `<span class="topic-sug small">${icon('bulb')}${esc(sug)}</span>` : ''}
  </li>`;
}
function tracksTab() {
  return `<div class="tracks">${TRACKS.map((t, i) => {
    const info = trackInfo(t.id), open = PLAN_OPEN.has(t.id);
    return `<section class="track ${open ? 'open' : ''}" style="--c:${t.color}">
      <header class="track-head" data-act="toggle-track" data-id="${t.id}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="track-num">${i + 1}</span>
        <div class="track-title"><h3>${esc(t.n)}</h3><div class="chips">${prioLabel(t.prio)}<span class="chip">${plural(info.total, 'conteúdo', 'conteúdos')}</span><span class="chip">${info.done} concluídos</span>${info.doing ? `<span class="chip">${info.doing} em andamento</span>` : ''}${info.review ? `<span class="chip chip-warn">${info.review} para revisar</span>` : ''}</div></div>
        <div class="track-stats"><div><strong>${nf(info.pct * 100)}%</strong><span class="muted small">concluído</span></div><div><strong>${fmtHours(info.minutes)}</strong><span class="muted small">investidas</span></div><div><strong>${nf(info.mastery, 1)}</strong><span class="muted small">domínio médio</span></div></div>
        <span class="track-chev">${icon('down')}</span>
      </header>
      ${bar(info.pct, t.color, 'bar-thin')}
      ${info.next ? `<p class="track-next small">${icon('compass')}Próximo recomendado: <button class="btn-link" data-act="open-skill" data-id="${info.next.id}">${esc(info.next.n)}</button></p>` : info.unlockHint ? `<p class="track-next small">${icon('lock')}Para destravar esta trilha, leve <button class="btn-link" data-act="open-skill" data-id="${info.unlockHint.id}">${esc(info.unlockHint.n)}</button> ao nível ${PREREQ_MIN}.</p>` : ''}
      ${open ? `<ul class="topics">${trackSkills(t.id).map(topicRow).join('')}</ul>` : ''}
    </section>`;
  }).join('')}</div>`;
}
act('toggle-track', (el) => { const id = el.dataset.id; PLAN_OPEN.has(id) ? PLAN_OPEN.delete(id) : PLAN_OPEN.add(id); renderView(); });
onChange('topic-status', (el) => setTopicStatus(el.dataset.id, el.value));
function setTopicStatus(id, s) {
  S.core.topics[id] = { s, at: Date.now() };
  if (s === 'review') S.skills.review[id] = true; else if (S.skills.review[id] && s !== 'review') delete S.skills.review[id];
  commit(['core', 'skills']);
  if (s === 'done') toast(`${SKILL[id].n} concluído. Lembre: concluir o conteúdo não aumenta o domínio sozinho; registre evidências.`, { type: 'success' });
}
act('study-skill', (el) => { const s = SKILL[el.dataset.id]; startStudy({ subject: `Estudar ${s.n}`, topic: s.id, track: s.t, minutes: set().pomodoro.focus }); });

/* ---------- planejador semanal ---------- */
function taskCard(t) {
  return `<li class="task ${t.done ? 'done' : ''}" draggable="${t.done ? 'false' : 'true'}" data-task="${t.id}" style="--c:${(TRACK[t.track] || TRACK.outro).color}">
    <button class="task-check" data-act="task-toggle" data-id="${t.id}" aria-label="${t.done ? 'Reabrir' : 'Concluir'} tarefa">${icon(t.done ? 'checkCircle' : 'circle')}</button>
    <div class="task-main"><b>${esc(t.title)}</b><span class="small muted">${trackLabel(t.track)}, ${fmtMin(t.duration || 0)}</span></div>
    <i class="task-prio" style="background:${(PRIO[t.priority] || PRIO.media).c}" title="Prioridade ${(PRIO[t.priority] || PRIO.media).n.toLowerCase()}"></i>
    <div class="task-actions">${t.done ? '' : `<button class="icon-btn" data-act="task-start" data-id="${t.id}" aria-label="Começar">${icon('play')}</button>`}<button class="icon-btn" data-act="task-edit" data-id="${t.id}" aria-label="Editar">${icon('pencil')}</button></div>
  </li>`;
}
function weekPlanner() {
  const start = addDays(startOfWeek(new Date()), PLAN_WEEK * 7);
  const days = [...Array(7)].map((_, i) => addDays(start, i));
  const goal = set().dailyGoal;
  const tpl = set().weekTemplate;
  return `<div class="period-nav"><button class="icon-btn" data-act="pweek" data-d="-1" aria-label="Semana anterior">${icon('left')}</button><div><b>${PLAN_WEEK === 0 ? 'Esta semana' : PLAN_WEEK === 1 ? 'Próxima semana' : `Semana de ${fmtDateShort(start)}`}</b><span class="muted small">${fmtDateShort(start)} a ${fmtDateShort(days[6])}</span></div><button class="icon-btn" data-act="pweek" data-d="1" aria-label="Próxima semana">${icon('right')}</button>
    <div class="spacer"></div><button class="btn btn-ghost btn-sm" data-act="task-new">${icon('plus')}Nova tarefa</button><button class="btn btn-primary btn-sm" data-act="plan-week">${icon('wand')}Planejar minha próxima semana</button></div>
  <div class="week">${days.map((d) => {
    const k = dayKey(d), tasks = S.tasks.list.filter((t) => t.date === k).sort(by((t) => (t.done ? 1 : 0) * 10 + ({ alta: 0, media: 1, baixa: 2 }[t.priority] ?? 1)));
    const load = sum(tasks, (t) => t.duration || 0), studied = dayMin(k);
    const tt = tpl[d.getDay()];
    return `<div class="day ${k === todayKey() ? 'is-today' : ''}" data-drop="${k}">
      <header><b>${WEEKDAYS_SHORT[d.getDay()]} ${d.getDate()}</b><span class="small muted">${tt ? esc(trackLabel(tt)) : 'livre'}</span></header>
      <div class="day-load"><span class="small ${load > goal ? 'warn' : 'muted'}">${fmtMin(load)} planejados</span>${studied ? `<span class="small ok">${fmtMin(studied)} estudados</span>` : ''}</div>
      <ul class="tasks">${tasks.map(taskCard).join('')}</ul>
      <button class="btn btn-text btn-sm day-add" data-act="task-new" data-date="${k}">${icon('plus')}Adicionar</button>
    </div>`;
  }).join('')}</div>
  <p class="muted small">Sugestão de distribuição: ${[1, 2, 3, 4, 5, 6, 0].map((wd) => `${WEEKDAYS_SHORT[wd]} ${tpl[wd] ? esc(trackLabel(tpl[wd])) : 'livre'}`).join(', ')}. É só uma sugestão: ajuste em Configurações. Arraste as tarefas entre os dias para reorganizar.</p>`;
}
act('pweek', (el) => { PLAN_WEEK += +el.dataset.d; renderView(); });

function monthPlanner() {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + PLAN_MONTH, 1);
  const gridStart = startOfWeek(first);
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = addDays(gridStart, i); if (i >= 35 && d.getMonth() !== first.getMonth()) break; cells.push(d); }
  return `<div class="period-nav"><button class="icon-btn" data-act="pmonth" data-d="-1" aria-label="Mês anterior">${icon('left')}</button><div><b>${MONTHS[first.getMonth()]} de ${first.getFullYear()}</b><span class="muted small">Toque em um dia para ver e adicionar tarefas</span></div><button class="icon-btn" data-act="pmonth" data-d="1" aria-label="Próximo mês">${icon('right')}</button></div>
  <div class="month"><div class="month-head">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map((d) => `<span>${d}</span>`).join('')}</div>
  <div class="month-grid">${cells.map((d) => {
    const k = dayKey(d), tasks = S.tasks.list.filter((t) => t.date === k), m = dayMin(k);
    return `<button class="mday ${d.getMonth() !== first.getMonth() ? 'other' : ''} ${k === todayKey() ? 'is-today' : ''}" data-act="month-day" data-day="${k}"><span class="mday-n">${d.getDate()}</span>${m ? `<span class="mday-min l${heatLevel(m)}">${fmtMin(m)}</span>` : ''}<span class="mday-tasks">${tasks.slice(0, 3).map((t) => `<i class="${t.done ? 'done' : ''}" style="--c:${(TRACK[t.track] || TRACK.outro).color}">${esc(t.title)}</i>`).join('')}${tasks.length > 3 ? `<em>+${tasks.length - 3}</em>` : ''}</span></button>`;
  }).join('')}</div></div>`;
}
act('pmonth', (el) => { PLAN_MONTH += +el.dataset.d; renderView(); });
act('month-day', (el) => {
  const k = el.dataset.day, tasks = S.tasks.list.filter((t) => t.date === k);
  openModal({ title: fmtDateLong(k), html: `${tasks.length ? `<ul class="tasks tasks-modal">${tasks.map(taskCard).join('')}</ul>` : '<p class="muted">Nenhuma tarefa neste dia.</p>'}<button class="btn btn-primary" data-act="task-new" data-date="${k}">${icon('plus')}Adicionar tarefa</button>` });
});

/* ---------- tarefas ---------- */
function taskForm(t = {}) {
  return `<form data-form="task" class="form-grid">
    <input type="hidden" name="id" value="${esc(t.id || '')}">
    <label class="field span-2"><span>O que estudar ou fazer</span><input class="input" name="title" required maxlength="120" value="${esc(t.title || '')}" placeholder="Ex.: Exercícios de JOIN no StrataScratch"></label>
    <label class="field"><span>Trilha</span><select class="input" name="track">${trackOptions(t.track || 't2')}</select></label>
    <label class="field"><span>Habilidade (opcional)</span><select class="input" name="skill"><option value="">Nenhuma</option>${skillOptions(t.skill ? [t.skill] : [])}</select></label>
    <label class="field"><span>Duração estimada (min)</span><input class="input" type="number" name="duration" min="5" max="480" step="5" value="${t.duration || 30}"></label>
    <label class="field"><span>Prioridade</span><select class="input" name="priority">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${(t.priority || 'media') === k ? 'selected' : ''}>${v.n}</option>`).join('')}</select></label>
    <label class="field"><span>Data</span><input class="input" type="date" name="date" required value="${esc(t.date || todayKey())}"></label>
    <div class="form-actions span-2">${t.id ? '<button class="btn btn-text btn-danger-text" type="button" data-act="task-del" data-id="' + t.id + '">Apagar</button><div class="spacer"></div>' : ''}<button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${t.id ? 'Salvar tarefa' : 'Criar tarefa'}</button></div>
  </form>`;
}
act('task-new', (el) => { closeModal(); openModal({ title: 'Nova tarefa', html: taskForm({ date: el.dataset.date || todayKey() }) }); });
act('task-edit', (el) => { const t = S.tasks.list.find((x) => x.id === el.dataset.id); if (!t) return; closeModal(); openModal({ title: 'Editar tarefa', html: taskForm(t) }); });
onForm('task', (f) => {
  const d = formData(f);
  if (!d.title) return toast('Dê um nome à tarefa.', { type: 'error' });
  const data = { title: d.title, track: d.track, skill: d.skill, duration: clamp(parseInt(d.duration, 10) || 30, 5, 480), priority: d.priority, date: d.date };
  if (d.id) Object.assign(S.tasks.list.find((x) => x.id === d.id), data);
  else S.tasks.list.push({ id: uid('t'), ...data, done: false, createdAt: Date.now() });
  closeModal(); commit('tasks');
  toast(d.id ? 'Tarefa salva.' : 'Tarefa criada.', { type: 'success' });
});
act('task-del', async (el) => { if (!(await confirmDialog({ title: 'Apagar tarefa?', text: 'Esta ação não pode ser desfeita.', confirm: 'Apagar', danger: true }))) return; S.tasks.list = S.tasks.list.filter((t) => t.id !== el.dataset.id); closeModal(); commit('tasks'); });
act('task-toggle', (el) => {
  const t = S.tasks.list.find((x) => x.id === el.dataset.id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  commit('tasks');
  if (t.done) { const li = el.closest('.task'); if (li) li.classList.add('pop'); toast('Tarefa concluída.', { type: 'success' }); }
  if ($('.tasks-modal')) { closeModal(); }
});
act('task-start', (el) => { const t = S.tasks.list.find((x) => x.id === el.dataset.id); if (!t) return; closeModal(); startStudy({ subject: t.title, topic: t.skill || '', track: t.skill ? SKILL[t.skill].t : t.track, minutes: t.duration || 25, task: t.id }); });

/* arrastar e soltar entre dias (desktop) */
let dragTask = null;
document.addEventListener('dragstart', (e) => { const t = e.target.closest && e.target.closest('[data-task]'); if (!t) return; dragTask = t.dataset.task; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragTask); } catch (er) { /* alguns navegadores */ } t.classList.add('dragging'); });
document.addEventListener('dragend', (e) => { $$('.dragging').forEach((x) => x.classList.remove('dragging')); $$('.drop-over').forEach((x) => x.classList.remove('drop-over')); });
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !dragTask) return; e.preventDefault(); $$('.drop-over').forEach((x) => x !== z && x.classList.remove('drop-over')); z.classList.add('drop-over'); });
document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !dragTask) return; e.preventDefault(); const t = S.tasks.list.find((x) => x.id === dragTask); dragTask = null; if (t && t.date !== z.dataset.drop) { t.date = z.dataset.drop; commit('tasks'); toast(`Tarefa movida para ${relDay(t.date)}.`, { type: 'info' }); } });

/* ---------- Planejar minha próxima semana ---------- */
act('plan-week', () => {
  const nextMon = addDays(startOfWeek(new Date()), 7);
  const plan = planNextWeek(nextMon);
  const byDay = {};
  plan.proposals.forEach((p, i) => { p.i = i; (byDay[p.date] = byDay[p.date] || []).push(p); });
  const rateTxt = plan.rate === null ? 'Sem tarefas na semana anterior para comparar.' : `Você concluiu ${nf(plan.rate * 100)}% das tarefas da semana passada${plan.factor < 1 ? `, então reduzi a carga diária para ${fmtMin(plan.cap)} para não sobrecarregar.` : '.'}`;
  openModal({
    title: 'Planejar minha próxima semana', size: 'modal-lg',
    html: `<p class="muted">${rateTxt} Limite por dia: ${fmtMin(plan.cap)}. Revise as sugestões e aprove só o que fizer sentido.</p>
      <form data-form="plan-approve" class="plan-list">${[...Array(7)].map((_, i) => { const k = dayKey(addDays(nextMon, i)); const items = byDay[k] || []; return `<div class="plan-day"><b>${WEEKDAYS[parseDay(k).getDay()]}, ${fmtDateShort(k)}</b>${items.length ? items.map((p) => `<label class="plan-item"><input type="checkbox" name="pick" data-multi="1" value="${p.i}" checked><span>${trackChip(p.track)} ${esc(p.title)}</span><em>${fmtMin(p.duration)}${p.kind === 'carry' ? ', pendente da semana anterior' : ''}</em></label>`).join('') : '<span class="muted small">Livre</span>'}</div>`; }).join('')}
      ${plan.overflow.length ? `<div class="plan-overflow"><b>Não couberam sem exceder o limite diário</b>${plan.overflow.map((p) => `<span class="small muted">${esc(p.title)} (${fmtMin(p.duration)})</span>`).join('')}</div>` : ''}
      <div class="form-actions"><button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${icon('check')}Aprovar planejamento</button></div></form>`,
    onMount: (m) => { m._plan = plan; m.querySelector('form')._plan = plan; },
  });
});
onForm('plan-approve', (f) => {
  const plan = f._plan; if (!plan) return;
  const picks = (formData(f).pick || []).map(Number);
  let created = 0, moved = 0;
  for (const i of picks) {
    const p = plan.proposals[i];
    if (p.kind === 'carry') { const t = S.tasks.list.find((x) => x.id === p.taskId); if (t) { t.date = p.date; moved++; } }
    else { S.tasks.list.push({ id: uid('t'), title: p.title, track: p.track, skill: p.skill || '', duration: p.duration, priority: p.priority, date: p.date, done: false, createdAt: Date.now(), planned: true }); created++; }
  }
  S.core.weekPlans[dayKey(addDays(startOfWeek(new Date()), 7))] = { approvedAt: Date.now(), created, moved };
  closeModal(); commit(['tasks', 'core']);
  PLAN_TAB = 'semana'; PLAN_WEEK = 1; navigate('plano');
  toast(`Planejamento aprovado: ${plural(created, 'tarefa nova', 'tarefas novas')}${moved ? ` e ${plural(moved, 'remanejada', 'remanejadas')}` : ''}.`, { type: 'success' });
});

    const body = { trilhas: tracksTab, semana: weekPlanner, mes: monthPlanner }[PLAN_TAB]();

  },
});

let SKILL_GROUP = 'sql';
const STATE_ICON = { locked: 'lock', available: 'unlock', developing: 'trend', mastered: 'star', review: 'refresh' };
act('skill-group', (el) => { SKILL_GROUP = el.dataset.tab; renderView(); });

function groupDepths(gid) {
  const list = SKILLS.filter((s) => s.g === gid);
  const ids = new Set(list.map((s) => s.id));
  const depth = {};
  const calc = (s) => { if (depth[s.id] != null) return depth[s.id]; const inner = s.p.filter((p) => ids.has(p)); depth[s.id] = inner.length ? 1 + Math.max(...inner.map((p) => calc(SKILL[p]))) : 0; return depth[s.id]; };
  list.forEach(calc);
  return { list, depth, ids };
}
function treeNode(s, ids) {
  const st = skillState(s.id);
  const outside = s.p.filter((p) => !ids.has(p));
  return `<button class="node st-${st.state}" data-act="open-skill" data-id="${s.id}" data-node="${s.id}" aria-label="${esc(s.n)}: ${STATE_LABEL[st.state]}, nível ${st.level}">
    <span class="node-ic">${icon(STATE_ICON[st.state])}</span>
    <span class="node-body"><b>${esc(s.n)}</b>${pips(st.level)}${outside.length ? `<span class="node-req">Requer ${outside.map((p) => esc(SKILL[p].n)).join(', ')}</span>` : ''}</span>
  </button>`;
}
function treeView() {
  const g = GROUP[SKILL_GROUP];
  const { list, depth, ids } = groupDepths(SKILL_GROUP);
  const cols = Math.max(...Object.values(depth)) + 1;
  const counts = { mastered: 0, developing: 0, available: 0, locked: 0, review: 0 };
  list.forEach((s) => counts[skillState(s.id).state]++);
  let html = `<div class="tree-wrap" style="--g:${g.color}"><div class="tree" id="tree" style="--cols:${cols}">`;
  for (let c = 0; c < cols; c++) {
    html += `<div class="tier"><span class="tier-label">${c === 0 ? 'Base' : `Camada ${c + 1}`}</span>${list.filter((s) => depth[s.id] === c).map((s) => treeNode(s, ids)).join('')}</div>`;
  }
  html += `</div><svg class="tree-lines" id="tree-lines" aria-hidden="true"></svg></div>`;
  return `<div class="tree-summary">${Object.entries(counts).filter(([, n]) => n).map(([k, n]) => `<span class="legend-item st-${k}">${icon(STATE_ICON[k])}${n} ${(n === 1 ? STATE_LABEL : STATE_PLURAL)[k].toLowerCase()}</span>`).join('')}</div>${html}`;
}
function drawTreeLines() {
  const tree = $('#tree'), svg = $('#tree-lines');
  if (!tree || !svg) return;
  if (window.matchMedia('(max-width: 760px)').matches) { svg.innerHTML = ''; return; }
  const wrap = tree.parentElement, wr = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.scrollWidth); svg.setAttribute('height', wrap.scrollHeight);
  svg.setAttribute('viewBox', `0 0 ${wrap.scrollWidth} ${wrap.scrollHeight}`);
  const { list, ids } = groupDepths(SKILL_GROUP);
  let paths = '';
  for (const s of list) {
    const to = tree.querySelector(`[data-node="${CSS.escape(s.id)}"]`); if (!to) continue;
    const tr = to.getBoundingClientRect();
    for (const p of s.p.filter((x) => ids.has(x))) {
      const from = tree.querySelector(`[data-node="${CSS.escape(p)}"]`); if (!from) continue;
      const fr = from.getBoundingClientRect();
      const x1 = fr.right - wr.left + wrap.scrollLeft, y1 = fr.top + fr.height / 2 - wr.top + wrap.scrollTop;
      const x2 = tr.left - wr.left + wrap.scrollLeft, y2 = tr.top + tr.height / 2 - wr.top + wrap.scrollTop;
      const mx = (x1 + x2) / 2;
      const on = lvl(p) >= PREREQ_MIN;
      paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" class="${on ? 'on' : ''}"/>`;
    }
  }
  svg.innerHTML = paths;
}
window.addEventListener('resize', () => { if (CURRENT === 'habilidades') drawTreeLines(); });

function applyLevel(id, to, note, evidenceId) {
  const from = lvl(id);
  if (from === to) return;
  S.skills.levels[id] = to;
  S.skills.history.push({ id: uid('h'), skill: id, from, to, ts: Date.now(), note: note || '', evidence: evidenceId || '' });
  if (to > from && S.skills.review[id]) delete S.skills.review[id];
  commit('skills');
  toast(`${SKILL[id].n}: nível ${to} (${MASTERY[to].n.toLowerCase()}).`, { type: to > from ? 'success' : 'info' });
}
onForm('skill-level', (f) => {
  const d = formData(f), id = d.id, to = +d.level, from = lvl(id), st = skillState(id);
  if (to === from) return toast('Esse já é o nível atual.', { type: 'info' });
  if (to > from && !st.met) return toast('Desenvolva os pré-requisitos antes de avançar.', { type: 'warn' });
  const needsEvidence = to > from && (to >= 4 || to - from >= 2);
  if (needsEvidence) return openEvidence({ skill: id, requiredFor: to });
  applyLevel(id, to, to > from ? 'Atualização manual' : 'Ajuste para baixo');
  openSkill(id);
});

act('evidence-new', (el) => openEvidence({ skill: el.dataset.skill || '' }));

      <label class="field span-2"><span>Link (repositório, notebook, certificado)</span><input class="input" type="url" name="link" placeholder="https://"></label>
      <div class="form-actions span-2"><button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${requiredFor ? 'Registrar e atualizar nível' : 'Registrar evidência'}</button></div></form>`,
    onMount: (m) => { m.querySelector('form').dataset.skill = skill; },
  });
