onForm('evidence', (f) => {
  const d = formData(f), skill = f.dataset.skill, req = +d.requiredFor;
  let evId = d.existing || '';
  if (!evId) {
    if (!d.desc || d.desc.length < 8) return toast('Descreva a evidência em pelo menos uma frase.', { type: 'error' });
    if (!d.skills || !d.skills.length) return toast('Escolha pelo menos uma habilidade.', { type: 'error' });
    if (req && !d.skills.includes(skill)) d.skills.push(skill);
    if (d.link && !/^https?:\/\//i.test(d.link)) return toast('O link precisa começar com http:// ou https://.', { type: 'error' });
    evId = uid('e');
    S.skills.evidences.push({ id: evId, ts: Date.now(), skills: d.skills, type: d.type, desc: d.desc, link: d.link, qty: clamp(parseInt(d.qty, 10) || 1, 1, 500), project: d.project || '' });
  }
  closeModal();
  if (req) applyLevel(skill, req, 'Avanço com evidência', evId); else { commit('skills'); toast('Evidência registrada.', { type: 'success' }); }
  if (skill && $('#drawer').classList.contains('open')) openSkill(skill);
});
act('evidence-del', async (el) => {
  if (!(await confirmDialog({ title: 'Apagar evidência?', text: 'Os níveis já alcançados não mudam.', confirm: 'Apagar', danger: true }))) return;
  const e = S.skills.evidences.find((x) => x.id === el.dataset.id);
  S.skills.evidences = S.skills.evidences.filter((x) => x.id !== el.dataset.id);
  commit('skills');
  if (e && e.skills && e.skills[0] && $('#drawer').classList.contains('open')) openSkill(e.skills[0]);
});

    html: `<form data-form="assess" class="stack-form"><input type="hidden" name="id" value="${id}">

      ${crit.map((c, i) => `<label class="check"><input type="checkbox" name="c${i}"><span>${esc(c)}</span></label>`).join('')}
      ${cards ? `<p class="small muted">${icon('layers')}Dica: há ${plural(cards, 'flashcard', 'flashcards')} de ${esc(TRACK[s.t].short)} para testar antes.</p>` : ''}
      <label class="check"><input type="checkbox" name="adjust" checked><span>Ajustar meu nível se eu não cumprir metade dos critérios</span></label>
      <div class="form-actions"><button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="submit">Concluir avaliação</button></div></form>`,
  });
}
onForm('assess', (f) => {
  const d = formData(f), id = d.id, s = SKILL[id];
  const crit = s.c || [1, 2, 3];
  const ok = crit.filter((_, i) => d['c' + i]).length;
  const ratio = ok / crit.length;
  S.skills.assessed[id] = Date.now();
  closeModal();
  if (ratio === 1) {
    delete S.skills.review[id];
    S.skills.evidences.push({ id: uid('e'), ts: Date.now(), skills: [id], type: 'revisao', desc: `Avaliação de retenção aprovada no nível ${lvl(id)}`, link: '', qty: 1 });
    commit('skills');
    toast(`Nível ${lvl(id)} de ${s.n} confirmado.`, { type: 'success' });
  } else {
    S.skills.review[id] = true;
    if (ratio < 0.5 && d.adjust && lvl(id) > 1) { commit('skills', { silent: true }); applyLevel(id, lvl(id) - 1, `Avaliação de retenção: ${ok} de ${crit.length} critérios`); }
    else { commit('skills'); toast(`${s.n} marcada para revisão: ${ok} de ${crit.length} critérios cumpridos.`, { type: 'warn' }); }
  }
  if ($('#drawer').classList.contains('open')) openSkill(id);
});

    <p class="muted small">Links conferidos em novembro de 2026. Conteúdos e preços mudam: confirme no site antes de assinar algo.</p>`;

      ${pend.all.length ? `<button class="btn btn-primary btn-lg" data-act="study-cards">${icon('play')}Revisar agora</button>` : `<button class="btn btn-ghost" data-act="card-new">${icon('plus')}Novo cartão</button>`}

    ${panel('Baralhos', `<div class="decks">${S.cards.decks.map((d) => { const all = S.cards.cards.filter((c) => c.deck === d.id); const p = dueCards(d.id); return `<div class="deck" style="--c:${(TRACK[d.tech] || TRACK.outro).color}"><div><b>${esc(d.n)}</b><span class="muted small">${plural(all.length, 'cartão', 'cartões')}, ${p.due.length} para revisar, ${p.fresh.length} novos</span></div><div class="deck-actions"><button class="btn btn-sm ${p.all.length ? 'btn-secondary' : 'btn-ghost'}" data-act="study-cards" data-deck="${d.id}" ${p.all.length ? '' : 'disabled'}>Estudar</button><button class="icon-btn" data-act="deck-edit" data-id="${d.id}" aria-label="Editar baralho">${icon('pencil')}</button></div></div>`; }).join('')}</div>`, { actions: `<button class="btn btn-sm btn-ghost" data-act="deck-new">${icon('plus')}Novo baralho</button>` })}
    ${panel('Cartões', `<div class="lib-tools"><label class="search">${icon('search')}<input class="input" type="search" placeholder="Buscar cartões" value="${esc(f.q)}" data-input="card-q" aria-label="Buscar cartões"></label><select class="input input-sm" data-change="card-deck" aria-label="Baralho"><option value="">Todos os baralhos</option>${S.cards.decks.map((d) => `<option value="${d.id}" ${f.deck === d.id ? 'selected' : ''}>${esc(d.n)}</option>`).join('')}</select><button class="btn btn-primary btn-sm" data-act="card-new">${icon('plus')}Novo cartão</button></div>

function cardForm(c = {}) {

    <label class="field"><span>Baralho</span><select class="input" name="deck" required>${S.cards.decks.map((d) => `<option value="${d.id}" ${c.deck === d.id ? 'selected' : ''}>${esc(d.n)}</option>`).join('')}</select></label>
    <label class="field"><span>Dificuldade</span><select class="input" name="dif">${[[1, 'Fácil'], [2, 'Média'], [3, 'Difícil']].map(([v, l]) => `<option value="${v}" ${(c.dif || 2) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field span-2"><span>Pergunta</span><textarea class="input" name="q" rows="2" required maxlength="400">${esc(c.q || '')}</textarea></label>
    <label class="field span-2"><span>Resposta</span><textarea class="input" name="a" rows="4" required maxlength="1500">${esc(c.a || '')}</textarea></label>
    <label class="field span-2"><span>Tags (separadas por vírgula)</span><input class="input" name="tags" maxlength="120" value="${esc((c.tags || []).join(', '))}" placeholder="joins, entrevistas"></label>
    <div class="form-actions span-2">${c.id ? `<button class="btn btn-text btn-danger-text" type="button" data-act="card-del" data-id="${c.id}">Apagar</button><div class="spacer"></div>` : ''}<button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${c.id ? 'Salvar cartão' : 'Criar cartão'}</button></div></form>`;
}
act('card-new', (el) => { if (!S.cards.decks.length) return toast('Crie um baralho primeiro.', { type: 'warn' }); openModal({ title: 'Novo cartão', html: cardForm({ deck: el.dataset.deck || CARD_FILTER.deck || S.cards.decks[0].id, q: el.dataset.q || '', a: el.dataset.a || '' }) }); });
act('card-edit', (el) => openModal({ title: 'Editar cartão', html: cardForm(S.cards.cards.find((c) => c.id === el.dataset.id)) }));
onForm('card', (f) => {
  const d = formData(f);
  const deck = S.cards.decks.find((x) => x.id === d.deck);
  const data = { deck: d.deck, q: d.q, a: d.a, dif: +d.dif, tags: d.tags.split(',').map((t) => t.trim()).filter(Boolean), tech: deck ? deck.tech : '' };
  if (d.id) Object.assign(S.cards.cards.find((c) => c.id === d.id), data);
  else S.cards.cards.push({ id: uid('card'), ...data, createdAt: Date.now(), srs: newSrs(), hist: [] });
  closeModal(); commit('cards'); toast(d.id ? 'Cartão salvo.' : 'Cartão criado. Ele entra na fila de novos.', { type: 'success' });
});
act('card-del', async (el) => { if (!(await confirmDialog({ title: 'Apagar cartão?', text: 'O histórico de revisões dele também será apagado.', confirm: 'Apagar', danger: true }))) return; S.cards.cards = S.cards.cards.filter((c) => c.id !== el.dataset.id); closeModal(); commit('cards'); });

/* ---------- sessão de revisão ---------- */
const STUDY = { queue: [], idx: 0, flipped: false, done: 0, ok: 0, repeats: {} };
act('study-cards', (el) => {
  const p = dueCards(el.dataset.deck || null);
  if (!p.all.length) return toast('Nenhum cartão para revisar agora.', { type: 'info' });
  Object.assign(STUDY, { queue: p.all.map((c) => c.id), idx: 0, flipped: false, done: 0, ok: 0, repeats: {} });
  openModal({ title: 'Revisão de flashcards', size: 'modal-study', html: '<div id="study"></div>', onMount: () => renderStudy(), onClose: () => scheduleRender() });
});
function renderStudy() {
  const root = $('#study'); if (!root) return;
  if (STUDY.idx >= STUDY.queue.length) {
    const acc = STUDY.done ? STUDY.ok / STUDY.done : 0;
    root.innerHTML = `<div class="study-end">${icon('checkCircle')}<h3>Revisão concluída</h3><p class="muted">${plural(STUDY.done, 'resposta', 'respostas')}, ${nf(acc * 100)}% de acerto. Os cartões que você errou voltam antes; os fáceis demoram mais para voltar.</p><button class="btn btn-primary" data-close>Fechar</button></div>`;
    return;
  }
  const c = S.cards.cards.find((x) => x.id === STUDY.queue[STUDY.idx]);
  if (!c) { STUDY.idx++; return renderStudy(); }
  const deck = S.cards.decks.find((d) => d.id === c.deck);
  root.innerHTML = `<div class="study-top"><span class="small muted">${STUDY.idx + 1} de ${STUDY.queue.length}</span>${bar(STUDY.idx / STUDY.queue.length, 'var(--primary)', 'bar-thin')}<span class="chip">${esc(deck ? deck.n : '')}</span></div>
    <div class="flip ${STUDY.flipped ? 'is-flipped' : ''}" data-act="study-flip" role="button" tabindex="0" aria-label="${STUDY.flipped ? 'Resposta' : 'Pergunta. Toque para ver a resposta'}">
      <div class="flip-inner"><div class="flip-face flip-front"><span class="flip-tag">Pergunta</span><p>${esc(c.q)}</p><span class="muted small">Responda mentalmente e toque para virar</span></div>
      <div class="flip-face flip-back"><span class="flip-tag">Resposta</span><p class="flip-q muted small">${esc(c.q)}</p><p>${esc(c.a)}</p></div></div>
    </div>
    <div class="study-actions">${STUDY.flipped ? [[1, 'Errei', 'danger'], [2, 'Difícil', 'warn'], [3, 'Bom', 'ok'], [4, 'Fácil', 'primary']].map(([g, l, cls]) => `<button class="grade grade-${cls}" data-act="study-grade" data-g="${g}"><b>${l}</b><span>${intervalLabel(c.srs, g)}</span><kbd>${g}</kbd></button>`).join('') : `<button class="btn btn-primary btn-lg" data-act="study-flip">Mostrar resposta <kbd>espaço</kbd></button>`}</div>`;
}
act('study-flip', () => { if (!STUDY.flipped) { STUDY.flipped = true; renderStudy(); } });
act('study-grade', (el) => gradeCard(+el.dataset.g));
function gradeCard(g) {
  const c = S.cards.cards.find((x) => x.id === STUDY.queue[STUDY.idx]); if (!c) return;
  const k = todayKey();
  const log = (S.cards.log[k] = S.cards.log[k] || { n: 0, ok: 0, new: 0 });
  if (c.srs.st === 'new') log.new = (log.new || 0) + 1;
  log.n++; if (g >= 3) log.ok++;
  c.srs = srsNext(c.srs, g);
  c.hist = [...(c.hist || []), { ts: Date.now(), g }].slice(-8);
  STUDY.done++; if (g >= 3) STUDY.ok++;
  if (g <= 2 && (STUDY.repeats[c.id] || 0) < 3) { STUDY.repeats[c.id] = (STUDY.repeats[c.id] || 0) + 1; STUDY.queue.push(c.id); }
  STUDY.idx++; STUDY.flipped = false;
  commit('cards', { silent: true });
  checkAchievements();
  renderStudy();
}
document.addEventListener('keydown', (e) => {
  if (!$('#study') || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space' || e.key === 'Enter') { if (!STUDY.flipped && STUDY.idx < STUDY.queue.length) { e.preventDefault(); STUDY.flipped = true; renderStudy(); } }
  else if (STUDY.flipped && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); gradeCard(+e.key); }
});

act('note-edit', (el) => openModal({ title: 'Editar conceito', size: 'modal-lg', html: noteForm(S.notes.list.find((n) => n.id === el.dataset.id)) }));

act('note-card', (el) => { const n = S.notes.list.find((x) => x.id === el.dataset.id); if (!n) return; const deck = S.cards.decks.find((d) => n.skill && d.tech === SKILL[n.skill].t); openModal({ title: 'Criar flashcard a partir do conceito', html: cardForm({ deck: (deck || S.cards.decks[0] || {}).id, q: `Explique: ${n.concept}`, a: n.explanation }) }); });
act('note-review', (el) => {

act('note-reveal', () => { $('#note-reveal').hidden = false; $('#note-show').hidden = true; $('#note-grades').hidden = false; });

function projCard(p) {
  const steps = p.steps || [], done = steps.filter((s) => s.done).length;
  return `<article class="proj st-${p.status}" data-act="open-project" data-id="${p.id}" role="button" tabindex="0">
    <header><span class="chip chip-status s-${p.status}">${esc(STATUS_NAME[p.status])}</span>${p.repo ? `<a class="icon-btn" href="${esc(p.repo)}" target="_blank" rel="noopener noreferrer" aria-label="Repositório" onclick="event.stopPropagation()">${icon('github')}</a>` : ''}</header>

    <p class="muted small">${esc(p.objective || p.desc || '')}</p>
    <div class="chips">${(p.techs || []).slice(0, 4).map((t) => `<span class="chip">${esc(t)}</span>`).join('')}<span class="chip">${esc(p.difficulty || 'iniciante')}</span></div>
    ${steps.length ? `<div class="proj-prog">${bar(done / steps.length, p.status === 'publicado' ? 'var(--success)' : 'var(--warning)', 'bar-thin')}<span class="small muted">${done} de ${steps.length} etapas</span></div>` : ''}
  </article>`;
}

  render() {
    const list = S.projects.list.filter((p) => !PROJ_FILTER || p.status === PROJ_FILTER);
    const published = S.projects.list.filter((p) => p.status === 'publicado');
    const counts = {}; S.projects.list.forEach((p) => { counts[p.status] = (counts[p.status] || 0) + 1; });

      <div class="cat-chips"><button class="chip chip-btn ${!PROJ_FILTER ? 'on' : ''}" data-act="proj-filter" data-s="">Todos (${S.projects.list.length})</button>${PROJECT_STATUS.map((s) => `<button class="chip chip-btn ${PROJ_FILTER === s.id ? 'on' : ''}" data-act="proj-filter" data-s="${s.id}">${esc(s.n)} (${counts[s.id] || 0})</button>`).join('')}</div>
      ${list.length ? `<div class="proj-grid">${list.map(projCard).join('')}</div>` : emptyState('hammer', S.projects.list.length ? 'Nenhum projeto neste status' : 'Nenhum projeto ainda', 'Comece por um modelo do seu nível: análise exploratória, consultas SQL ou um dashboard comercial.', `<button class="btn btn-primary" data-act="project-templates">${icon('wand')}Escolher um modelo</button>`)}`;
  },
});

/* ---------- modelos ---------- */
act('project-templates', () => {
  const lv = [['iniciante', 'Iniciante'], ['intermediário', 'Intermediário'], ['avançado', 'Avançado']];
  openModal({
    title: 'Modelos de projeto', size: 'modal-lg',
    html: lv.map(([k, n]) => `<h3 class="h3">${n}</h3><div class="tpl-grid">${PROJECT_TEMPLATES.filter((t) => t.lvl === k).map((t) => `<div class="tpl"><b>${esc(t.n)}</b><p class="muted small">${esc(t.d)}</p><div class="chips">${t.techs.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div><p class="small muted">Habilidades: ${t.skills.map((s) => esc(SKILL[s].n)).join(', ')}</p><button class="btn btn-sm btn-secondary" data-act="project-from-tpl" data-tpl="${t.id}">Usar este modelo</button></div>`).join('')}</div>`).join(''),
  });
});
act('project-from-tpl', (el) => {
  const t = PROJECT_TEMPLATES.find((x) => x.id === el.dataset.tpl); if (!t) return;
  const p = { id: uid('p'), name: t.n, desc: t.d, objective: t.d, problem: '', dataset: '', techs: [...t.techs], skills: [...t.skills], difficulty: t.lvl, status: 'planejado', startDate: '', repo: '', learnings: '', difficulties: '', results: '', notes: '', steps: t.steps.map((s) => ({ id: uid('st'), text: s, done: false })), createdAt: Date.now(), template: t.id };
  S.projects.list.unshift(p);
  closeModal(); closeDrawer(); commit('projects');
  if (CURRENT !== 'projetos') navigate('projetos');
  openProject(p.id);
  toast('Projeto criado a partir do modelo. Defina o problema e o dataset para começar.', { type: 'success' });
});

act('project-new', () => openModal({ title: 'Novo projeto', size: 'modal-lg', html: projectForm({ difficulty: 'iniciante' }) }));
act('project-edit', (el) => { const p = S.projects.list.find((x) => x.id === el.dataset.id); closeModal(); openModal({ title: 'Editar projeto', size: 'modal-lg', html: projectForm(p) }); });
onForm('project', (f) => {
  const d = formData(f);
  if (d.repo && !/^https?:\/\//i.test(d.repo)) return toast('O link precisa começar com http:// ou https://.', { type: 'error' });
  const data = { name: d.name, objective: d.objective, problem: d.problem, dataset: d.dataset, techs: d.techs.split(',').map((t) => t.trim()).filter(Boolean), difficulty: d.difficulty, startDate: d.startDate, skills: d.skills || [], repo: d.repo, learnings: d.learnings, difficulties: d.difficulties, results: d.results, notes: d.notes };
  let id = d.id;
  if (id) Object.assign(S.projects.list.find((x) => x.id === id), data);
  else { id = uid('p'); S.projects.list.unshift({ id, ...data, status: 'ideia', steps: [], createdAt: Date.now() }); }
  closeModal(); commit('projects'); openProject(id);
});

/* ---------- detalhe ---------- */
act('open-project', (el) => { closeDrawer(); openProject(el.dataset.id); });
function openProject(id) {
  const p = S.projects.list.find((x) => x.id === id); if (!p) return;
  closeModal();
  const steps = p.steps || [], done = steps.filter((s) => s.done).length;
  const evid = S.skills.evidences.filter((e) => e.project === id);
  const field = (label, v) => v ? `<div class="pd-field"><span class="muted small">${label}</span><p>${esc(v)}</p></div>` : '';
  openModal({
    title: p.name, size: 'modal-lg',
    html: `<div class="pd">
      <div class="pd-top"><label class="field field-inline"><span>Status</span><select class="input input-sm" data-change="project-status" data-id="${id}">${PROJECT_STATUS.map((s) => `<option value="${s.id}" ${p.status === s.id ? 'selected' : ''}>${esc(s.n)}</option>`).join('')}</select></label>
        <div class="spacer"></div><button class="btn btn-sm btn-primary" data-act="project-session" data-id="${id}">${icon('play')}Trabalhar agora</button><button class="btn btn-sm btn-ghost" data-act="project-edit" data-id="${id}">${icon('pencil')}Editar</button></div>
      <div class="chips">${(p.techs || []).map((t) => `<span class="chip">${esc(t)}</span>`).join('')}<span class="chip">${esc(p.difficulty || '')}</span>${p.startDate ? `<span class="chip">Início: ${fmtDateShort(p.startDate)}</span>` : ''}${p.completedAt ? `<span class="chip chip-ok">Concluído em ${fmtDateShort(p.completedAt)}</span>` : ''}</div>
      ${field('Objetivo', p.objective)}${field('Problema que pretende resolver', p.problem)}${field('Dataset', p.dataset)}
      <div class="pd-field"><span class="muted small">Habilidades exercitadas</span><div class="chips">${(p.skills || []).map((s) => `<button class="chip chip-btn" data-act="open-skill" data-id="${s}">${esc(SKILL[s].n)} ${pips(lvl(s))}</button>`).join('') || '<span class="muted small">Nenhuma vinculada.</span>'}</div></div>
      <div class="pd-field"><span class="muted small">Etapas de desenvolvimento (${done} de ${steps.length})</span>${steps.length ? bar(done / steps.length, 'var(--warning)', 'bar-thin') : ''}
        <ul class="checklist">${steps.map((s, i) => `<li><label class="check"><input type="checkbox" data-change="step-toggle" data-id="${id}" data-i="${i}" ${s.done ? 'checked' : ''}><span>${esc(s.text)}</span></label><button class="icon-btn" data-act="step-del" data-id="${id}" data-i="${i}" aria-label="Remover etapa">${icon('trash')}</button></li>`).join('')}</ul>
        <form data-form="step-add" class="inline-form" data-id="${id}"><input class="input" name="text" required maxlength="160" placeholder="Nova etapa"><button class="btn btn-secondary" type="submit">${icon('plus')}Adicionar</button></form></div>
      ${field('Aprendizados', p.learnings)}${field('Dificuldades', p.difficulties)}${field('Resultados', p.results)}${field('Anotações', p.notes)}
      ${p.repo ? `<div class="pd-field"><span class="muted small">Repositório</span><p><a href="${esc(p.repo)}" target="_blank" rel="noopener noreferrer">${esc(p.repo)}</a></p></div>` : ''}
      <div class="pd-field"><span class="muted small">Evidências de conclusão</span>${evid.length ? `<ul class="evid">${evid.map((e) => `<li>${icon(EVIDENCE_TYPES[e.type].icon)}<div><b>${esc(EVIDENCE_TYPES[e.type].n)}</b><span class="small">${esc(e.desc)}</span><span class="muted small">${(e.skills || []).map((s) => esc(SKILL[s].n)).join(', ')}</span></div></li>`).join('')}</ul>` : '<p class="muted small">Nenhuma evidência. Ao concluir, registre quais habilidades o projeto realmente comprovou.</p>'}
        <button class="btn btn-sm btn-ghost" data-act="project-evidence" data-id="${id}">${icon('award')}Registrar evidência</button></div>
      <div class="form-actions"><button class="btn btn-text btn-danger-text" data-act="project-del" data-id="${id}">Apagar projeto</button></div></div>`,
  });
}
onChange('project-status', (el) => {
  const p = S.projects.list.find((x) => x.id === el.dataset.id); const to = el.value;
  if (to === 'publicado' && !p.repo) { el.value = p.status; return toast('Para publicar, adicione o link do repositório em Editar.', { type: 'warn' }); }
  const was = p.status; p.status = to;
  if (['andamento', 'concluido', 'publicado'].includes(to) && !p.startedAt) { p.startedAt = Date.now(); if (!p.startDate) p.startDate = todayKey(); }
  if (['concluido', 'publicado'].includes(to) && !p.completedAt) p.completedAt = Date.now();
  if (to === 'publicado' && !p.publishedAt) p.publishedAt = Date.now();
  if (!['concluido', 'publicado'].includes(to)) { p.completedAt = null; p.publishedAt = null; }
  commit('projects');
  if (['concluido', 'publicado'].includes(to) && !['concluido', 'publicado'].includes(was)) {
    toast(`Projeto concluído: +${set().xp.project} XP`, { type: 'xp', title: 'Construtor', action: { label: 'Registrar evidências', fn: () => openEvidence({ skill: (p.skills || [])[0] || '', project: p.id }) } });
  }
  openProject(p.id);
});
onChange('step-toggle', (el) => { const p = S.projects.list.find((x) => x.id === el.dataset.id); const s = p.steps[+el.dataset.i]; s.done = el.checked; s.doneAt = el.checked ? Date.now() : null; commit('projects'); openProject(p.id); });
act('step-del', (el) => { const p = S.projects.list.find((x) => x.id === el.dataset.id); p.steps.splice(+el.dataset.i, 1); commit('projects'); openProject(p.id); });
onForm('step-add', (f) => { const p = S.projects.list.find((x) => x.id === f.dataset.id); p.steps = p.steps || []; p.steps.push({ id: uid('st'), text: f.elements.text.value.trim(), done: false }); commit('projects'); openProject(p.id); });
act('project-evidence', (el) => { const p = S.projects.list.find((x) => x.id === el.dataset.id); closeModal(); openEvidence({ skill: (p.skills || [])[0] || '', project: p.id }); });
act('project-session', (el) => { const p = S.projects.list.find((x) => x.id === el.dataset.id); closeModal(); if (p.status === 'ideia' || p.status === 'planejado') { p.status = 'andamento'; p.startedAt = p.startedAt || Date.now(); if (!p.startDate) p.startDate = todayKey(); commit('projects'); } startStudy({ subject: `Projeto: ${p.name}`, track: 'proj', minutes: set().pomodoro.deep, project: p.id }); });
act('project-del', async (el) => { if (!(await confirmDialog({ title: 'Apagar projeto?', text: 'O XP de conclusão deste projeto será removido. As evidências registradas continuam.', confirm: 'Apagar', danger: true }))) return; S.projects.list = S.projects.list.filter((x) => x.id !== el.dataset.id); closeModal(); commit('projects'); });

/* ==========================================================================
   DATAQUEST — Estatísticas e Conquistas
   ========================================================================== */

let STATS_PERIOD = 30;
const PERIODS = [[7, 'Últimos 7 dias'], [30, 'Últimos 30 dias'], [90, 'Últimos 90 dias'], [365, 'Últimos 365 dias'], [0, 'Todo o período']];
act('stats-period', (el) => { STATS_PERIOD = +el.dataset.p; renderView(); });

function periodRange() {
  const end = startOfDay(addDays(new Date(), 1)).getTime();
  if (STATS_PERIOD) return { t0: startOfDay(addDays(new Date(), -(STATS_PERIOD - 1))).getTime(), t1: end, days: STATS_PERIOD };
  const first = S.sessions.length ? startOfDay(new Date(S.sessions[0].start)) : startOfDay(new Date(S.core.createdAt));
  return { t0: first.getTime(), t1: end, days: Math.max(1, daysBetween(first, new Date()) + 1) };
}

view('estatisticas', {
  render() {
    const { t0, t1, days } = periodRange();
    const ss = rangeSessions(t0, t1);
    const minutes = sum(ss, sMin);
    const dayKeys = []; for (let d = new Date(t0); d.getTime() < t1; d = addDays(d, 1)) dayKeys.push(dayKey(d));
    const active = dayKeys.filter(isActive).length;
    const xpIn = sum(xpEvents().filter((e) => e.ts >= t0 && e.ts < t1), (e) => e.amount);
    const projDone = S.projects.list.filter((p) => p.completedAt >= t0 && p.completedAt < t1).length;
    const weeks = Math.max(1, days / 7);

    // 1. horas por semana (ou por dia no período de 7 dias)
    let bars;
    if (STATS_PERIOD === 7) bars = dayKeys.map((k) => ({ label: WEEKDAYS_SHORT[parseDay(k).getDay()], value: dayMin(k) / 60, tip: `${fmtDateShort(k)}: ${fmtMin(dayMin(k))}` }));
    else {
      const wk = {}; for (const k of dayKeys) { const w = weekKey(parseDay(k)); wk[w] = (wk[w] || 0) + dayMin(k); }
      bars = Object.entries(wk).map(([w, m]) => ({ label: fmtDateShort(w), value: m / 60, tip: `Semana de ${fmtDateShort(w)}: ${fmtMin(m)}` }));
    }
    // 2. distribuição por tecnologia
    const tr = byTrack(ss);
    const segs = Object.entries(tr).map(([id, m]) => ({ label: trackLabel(id), value: m, color: (TRACK[id] || TRACK.outro).color }));
    // 3. evolução mensal
    const mo = {}; for (const k of dayKeys) { const m = k.slice(0, 7); mo[m] = (mo[m] || 0) + dayMin(k); }
    const months = Object.entries(mo).map(([m, v]) => ({ label: `${MONTHS_SHORT[+m.slice(5) - 1]}/${m.slice(2, 4)}`, value: v / 60, tip: `${MONTHS[+m.slice(5) - 1]} de ${m.slice(0, 4)}: ${fmtMin(v)}` }));
    // 4. dia da semana
    const wd = [0, 0, 0, 0, 0, 0, 0]; for (const s of ss) wd[new Date(s.start).getDay()] += sMin(s);
    const order = [1, 2, 3, 4, 5, 6, 0];
    const wdBars = order.map((i) => ({ label: WEEKDAYS_SHORT[i], value: wd[i] / 60, tip: `${WEEKDAYS[i]}: ${fmtMin(wd[i])}`, color: 'var(--secondary)' }));
    // 6. XP acumulado no período
    let acc = 0; const xpPts = []; const evs = xpEvents().filter((e) => e.ts >= t0 && e.ts < t1); let ei = 0;
    for (const k of dayKeys) { const end = parseDay(k).getTime() + DAY_MS; while (ei < evs.length && evs[ei].ts < end) acc += evs[ei++].amount; xpPts.push({ label: fmtDateShort(k), value: acc }); }

    return `${pageHead('Estatísticas', 'Seu comportamento de estudo, medido apenas pelos seus registros.', `<button class="btn btn-ghost" data-act="export-csv">${icon('download')}Exportar CSV</button>`)}
    <div class="cat-chips">${PERIODS.map(([p, l]) => `<button class="chip chip-btn ${STATS_PERIOD === p ? 'on' : ''}" data-act="stats-period" data-p="${p}">${l}</button>`).join('')}</div>
    <div class="kpi-strip">
      ${kpi('Horas estudadas', fmtHours(minutes), `${fmtHours(minutes / weeks)} por semana`, 'clock')}
      ${kpi('Média diária', fmtMin(minutes / days), 'considerando todos os dias', 'gauge')}
      ${kpi('Dias ativos', `${active} de ${days}`, `${nf((active / days) * 100)}% do período`, 'calendar')}
      ${kpi('Maior sequência', plural(streaks().max, 'dia', 'dias'), 'em todo o histórico', 'flame')}
      ${kpi('Sessões', nf(ss.length), `média de ${fmtMin(ss.length ? minutes / ss.length : 0)}`, 'timer')}
      ${kpi('XP no período', nf(xpIn), `${nf(projDone)} projetos concluídos`, 'zap')}
    </div>
    <div class="grid-2">
      ${panel(STATS_PERIOD === 7 ? 'Horas por dia' : 'Horas por semana', barChart(bars, { fmt: (v) => nf(v, 1) + ' h', color: 'var(--primary)' }))}
      ${panel('Distribuição por tecnologia', donutChart(segs, { center: fmtHours(minutes, 0) }))}
      ${panel('Evolução mensal das horas', barChart(months, { fmt: (v) => nf(v, 1) + ' h', color: 'var(--success)' }))}
      ${panel('Estudos por dia da semana', barChart(wdBars, { fmt: (v) => nf(v, 1) + ' h' }))}
      ${panel('Progresso das trilhas', hBars(TRACKS.map((t) => { const i = trackInfo(t.id); return { label: t.short, right: `${i.done} de ${i.total}, ${fmtHours(i.minutes)}`, pct: i.pct, color: t.color }; })), { sub: 'Tópicos concluídos e horas investidas em todo o histórico.' })}
      ${panel('Histórico de XP', lineChart(xpPts, { fmt: (v) => nf(v), color: 'var(--warning)', empty: 'Nenhum XP ganho no período.' }), { sub: 'XP acumulado dentro do período.' })}
    </div>`;
  },
});
act('export-csv', () => {
  const rows = [['data', 'inicio', 'fim', 'minutos', 'trilha', 'habilidade', 'assunto', 'modo', 'status', 'manual', 'xp']];
  for (const s of S.sessions) rows.push([dayKey(new Date(s.start)), fmtTime(s.start), fmtTime(s.end), sMin(s), trackLabel(s.track), (SKILL[s.topic] || {}).n || '', s.subject || '', s.mode, s.status, s.manual ? 'sim' : 'não', sMin(s) * set().xp.perMinute]);
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  saveFile(`dataquest-sessoes-${todayKey()}.csv`, '\ufeff' + csv);
});

    }).join('')}</div>`;

function numField(label, path, val, min, max, step = 1, suffix = '') {
  return `<label class="field"><span>${label}</span><div class="input-suffix"><input class="input" type="number" min="${min}" max="${max}" step="${step}" value="${val}" data-change="set-num" data-path="${path}" data-min="${min}" data-max="${max}">${suffix ? `<em>${suffix}</em>` : ''}</div></label>`;
}
function toggleField(label, path, val, hint = '') {
  return `<label class="switch"><input type="checkbox" data-change="set-bool" data-path="${path}" ${val ? 'checked' : ''}><i></i><span>${label}${hint ? `<em class="muted small">${hint}</em>` : ''}</span></label>`;
}
function setPath(path, value) { const parts = path.split('.'); let o = S.core.settings; while (parts.length > 1) o = o[parts.shift()]; o[parts[0]] = value; }
onChange('set-num', (el) => { const v = clamp(parseFloat(el.value) || 0, +el.dataset.min, +el.dataset.max); el.value = v; setPath(el.dataset.path, v); commit('core'); if (el.dataset.path.startsWith('pomodoro.') && Timer.st.status === 'idle') { Timer.st.plannedSec = Timer.modeMin(Timer.st.mode) * 60; Timer.save(); } toast('Configuração salva.', { type: 'success', timeout: 1600 }); });
onChange('set-bool', (el) => { setPath(el.dataset.path, el.checked); commit('core'); });
onChange('set-text', (el) => { setPath(el.dataset.path, el.value.trim().slice(0, 40)); commit('core'); });
onChange('set-select', (el) => { setPath(el.dataset.path, el.value); commit('core'); if (el.dataset.path === 'theme') applyTheme(); });

/* ---------- backup ---------- */
function snapshot() { return { app: 'DATAQUEST', version: 1, exportedAt: new Date().toISOString(), data: { core: S.core, skills: S.skills, library: S.library, projects: S.projects, notes: S.notes, cards: S.cards, tasks: S.tasks, sessions: S.sessions } }; }
act('export-json', () => saveFile(`dataquest-backup-${todayKey()}.json`, JSON.stringify(snapshot(), null, 1)));
act('import-json', () => {
  openModal({
    title: 'Importar backup',
    html: `<p class="muted">Escolha um arquivo exportado pelo DATAQUEST ou cole o conteúdo dele. Os dados são validados antes de qualquer alteração.</p>
      <label class="field"><span>Arquivo .json</span><input class="input" type="file" accept=".json,application/json" id="imp-file"></label>
      <label class="field"><span>Ou cole o conteúdo</span><textarea class="input mono" rows="6" id="imp-text" spellcheck="false"></textarea></label>
      <div id="imp-result"></div>
      <div class="form-actions"><button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-secondary" type="button" data-act="imp-check">Validar</button></div>`,
    onMount: (m) => { $('#imp-file', m).onchange = async (e) => { const f = e.target.files[0]; if (f) { $('#imp-text', m).value = await f.text(); ACTIONS['imp-check'](); } }; },
  });
});
let IMPORT_DATA = null;
function validateBackup(obj) {
  const errs = [];
  if (!obj || obj.app !== 'DATAQUEST' || !obj.data) return ['O arquivo não é um backup do DATAQUEST.'];
  const d = obj.data;
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  if (!isObj(d.core) || !isObj(d.core.settings)) errs.push('Configurações ausentes ou inválidas.');
  if (!Array.isArray(d.sessions)) errs.push('Lista de sessões ausente.');
  else if (d.sessions.some((s) => !s || typeof s.start !== 'number' || typeof s.end !== 'number' || typeof s.sec !== 'number' || s.sec < 0 || s.end < s.start)) errs.push('Há sessões com horários ou durações inválidos.');
  for (const k of ['projects', 'notes', 'tasks']) if (d[k] && !Array.isArray(d[k].list)) errs.push(`Seção ${k} inválida.`);
  if (d.cards && (!Array.isArray(d.cards.cards) || !Array.isArray(d.cards.decks))) errs.push('Flashcards inválidos.');
  if (d.skills && !isObj(d.skills.levels)) errs.push('Níveis de habilidade inválidos.');
  if (d.library && (!Array.isArray(d.library.materials) || !Array.isArray(d.library.books))) errs.push('Biblioteca inválida.');
  return errs;
}
act('imp-check', () => {
  const box = $('#imp-result'); if (!box) return;
  let obj;
  try { obj = JSON.parse($('#imp-text').value); } catch (e) { box.innerHTML = `<p class="warn small">${icon('alert')}O conteúdo não é um JSON válido.</p>`; return; }
  const errs = validateBackup(obj);
  if (errs.length) { box.innerHTML = `<div class="warn small">${errs.map((e) => `<p>${icon('alert')}${esc(e)}</p>`).join('')}</div>`; IMPORT_DATA = null; return; }
  IMPORT_DATA = obj.data;
  const d = obj.data;
  box.innerHTML = `<div class="imp-ok"><p>${icon('checkCircle')}Backup válido, exportado em ${esc(fmtDateLong(new Date(obj.exportedAt || Date.now())))}.</p>
    <ul class="list-plain small"><li><span>Sessões</span><b>${nf(d.sessions.length)}</b></li><li><span>Projetos</span><b>${nf((d.projects || {}).list ? d.projects.list.length : 0)}</b></li><li><span>Flashcards</span><b>${nf((d.cards || {}).cards ? d.cards.cards.length : 0)}</b></li><li><span>Conceitos</span><b>${nf((d.notes || {}).list ? d.notes.list.length : 0)}</b></li></ul>
    <div class="form-actions"><button class="btn btn-secondary" data-act="imp-apply" data-mode="merge">Mesclar com os dados atuais</button><button class="btn btn-danger" data-act="imp-apply" data-mode="replace">Substituir tudo</button></div></div>`;
});
function unionById(a = [], b = []) { const m = new Map(a.map((x) => [x.id, x])); for (const x of b) if (x && x.id && !m.has(x.id)) m.set(x.id, x); return [...m.values()]; }
act('imp-apply', async (el) => {
  const d = IMPORT_DATA; if (!d) return;
  const mode = el.dataset.mode;
  if (mode === 'replace' && !(await confirmDialog({ title: 'Substituir todos os dados?', text: 'Os dados atuais serão trocados pelos do backup. Considere exportar um backup antes.', confirm: 'Substituir', danger: true }))) return;
  const years = sessionYears();
  if (mode === 'replace') {
    const def = defaultState();
    for (const k of SLICES) S[k] = migrateSlice(k, d[k] ? JSON.parse(JSON.stringify(d[k])) : def[k]);
    S.sessions = d.sessions.slice().sort((a, b) => a.start - b.start);
  } else {
    S.sessions = unionById(S.sessions, d.sessions).sort((a, b) => a.start - b.start);
    if (d.tasks) S.tasks.list = unionById(S.tasks.list, d.tasks.list);
    if (d.projects) S.projects.list = unionById(S.projects.list, d.projects.list);
    if (d.notes) S.notes.list = unionById(S.notes.list, d.notes.list);
    if (d.cards) { S.cards.decks = unionById(S.cards.decks, d.cards.decks); S.cards.cards = unionById(S.cards.cards, d.cards.cards); for (const [k, v] of Object.entries(d.cards.log || {})) if (!S.cards.log[k]) S.cards.log[k] = v; }
    if (d.library) { S.library.materials = unionById(S.library.materials, d.library.materials); S.library.books = unionById(S.library.books, d.library.books); }
    if (d.skills) {
      for (const [id, v] of Object.entries(d.skills.levels || {})) if (SKILL[id] && v > lvl(id)) S.skills.levels[id] = v;
      S.skills.history = unionById(S.skills.history, d.skills.history); S.skills.evidences = unionById(S.skills.evidences, d.skills.evidences);
    }
    if (d.core) {
      for (const [k, v] of Object.entries(d.core.achievements || {})) if (!S.core.achievements[k] || v < S.core.achievements[k]) S.core.achievements[k] = v;
      for (const [k, v] of Object.entries(d.core.topics || {})) if (!S.core.topics[k]) S.core.topics[k] = v;
      for (const [k, v] of Object.entries(d.core.missions || {})) if (!S.core.missions[k]) S.core.missions[k] = v;
    }
  }
  S.core.sessionYears = [...new Set([...years, ...sessionYears()])];
  IMPORT_DATA = null; closeModal();
  commit([...SLICES, 'sessions']);
  applyTheme();
  toast(mode === 'replace' ? 'Backup restaurado.' : 'Backup mesclado aos seus dados.', { type: 'success' });
});
act('reset-all', async () => {
  if (!(await confirmDialog({ title: 'Restaurar dados iniciais?', text: 'Isso apaga sessões, XP, conquistas, projetos, flashcards e anotações, aqui e na sua conta. Não há como desfazer. Exporte um backup antes se quiser guardar algo.', confirm: 'Apagar tudo', danger: true, typed: 'APAGAR' }))) return;
  const years = sessionYears();
  S = defaultState();
  S.core.sessionYears = years;
  S.core.onboarded = true;
  try { localStorage.removeItem(TIMER_KEY); } catch (e) { /* sem armazenamento */ }
  Timer.load();
  commit([...SLICES, 'sessions']);
  applyTheme();
  toast('Dados iniciais restaurados.', { type: 'info' });
  navigate('inicio');
});

/* ==========================================================================
   DATAQUEST — conta (Supabase) e PWA, usados na versão do GitHub Pages
   ========================================================================== */

const AUTH_MSG = (err) => {
  const m = ((err && err.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'E-mail ou senha incorretos.';
  if (m.includes('email not confirmed')) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'Já existe uma conta com este e-mail. Use “Entrar”.';
  if (m.includes('password should be') || m.includes('weak')) return 'A senha é fraca. Use pelo menos 8 caracteres, misturando letras e números.';
  if (m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.';
  if (m.includes('failed to fetch') || m.includes('network')) return 'Sem conexão com o Supabase. Verifique a internet.';
  return (err && err.message) || 'Algo deu errado. Tente de novo.';
};
const redirectUrl = () => location.origin + location.pathname;

function openAuth(mode = 'login') {
  if (!Sync.client) return toast('A sincronização não está configurada nesta instalação. Veja o README.', { type: 'warn' });
  closeModal();
  const isLogin = mode === 'login';
  openModal({
    title: isLogin ? 'Entrar na sua conta' : 'Criar sua conta',
    size: 'modal-sm',
    html: `<form data-form="auth" class="stack-form" data-mode="${mode}">
      <p class="muted small">${isLogin ? 'Entre para sincronizar seus dados entre o computador e o celular.' : 'A conta guarda seus dados no seu Supabase, protegidos para que só você acesse.'}</p>
      <label class="field"><span>E-mail</span><input class="input" type="email" name="email" required autocomplete="email" autofocus></label>
      <label class="field"><span>Senha</span><input class="input" type="password" name="password" required minlength="8" autocomplete="${isLogin ? 'current-password' : 'new-password'}"></label>
      <p class="small warn" id="auth-err" hidden></p>
      <div class="form-actions"><button class="btn btn-primary btn-block" type="submit">${isLogin ? 'Entrar' : 'Criar conta'}</button></div>
      <div class="auth-links small">${isLogin ? `<button class="btn-link" type="button" data-act="auth-mode" data-mode="signup">Criar uma conta</button><button class="btn-link" type="button" data-act="auth-forgot">Esqueci minha senha</button>` : `<button class="btn-link" type="button" data-act="auth-mode" data-mode="login">Já tenho conta</button>`}</div>
    </form>`,
  });
}
act('auth-open', (el) => openAuth(el.dataset.mode || 'login'));
act('auth-mode', (el) => openAuth(el.dataset.mode));
onForm('auth', async (f) => {
  const d = formData(f), mode = f.dataset.mode;
  const btn = f.querySelector('button[type="submit"]'), err = $('#auth-err', f);
  const fail = (e) => { err.textContent = AUTH_MSG(e); err.hidden = false; btn.disabled = false; };
  btn.disabled = true; err.hidden = true;
  try {
    if (mode === 'login') {
      const { error } = await Sync.client.auth.signInWithPassword({ email: d.email, password: d.password });
      if (error) return fail(error);
      closeModal(); toast('Conectado. Sincronizando seus dados…', { type: 'success' });
    } else {
      const { data, error } = await Sync.client.auth.signUp({ email: d.email, password: d.password, options: { emailRedirectTo: redirectUrl() } });
      if (error) return fail(error);
      closeModal();
      if (data && data.session) toast('Conta criada. Seus dados deste aparelho vão para a nuvem.', { type: 'success' });
      else openModal({ title: 'Confirme seu e-mail', size: 'modal-sm', html: `<p>Enviamos um link de confirmação para <b>${esc(d.email)}</b>. Abra o link e depois entre aqui com seu e-mail e senha.</p><p class="muted small">Não chegou? Confira o spam. O envio gratuito do Supabase tem limite de alguns e-mails por hora.</p>`, actions: '<button class="btn btn-primary" data-close>Entendi</button>' });
    }
  } catch (e) { fail(e); }
});
act('auth-forgot', async () => {
  const input = $('form[data-form="auth"] input[name="email"]');
  const email = input && input.value.trim();
  if (!email) { toast('Digite seu e-mail no campo acima.', { type: 'warn' }); if (input) input.focus(); return; }
  const { error } = await Sync.client.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
  if (error) return toast(AUTH_MSG(error), { type: 'error' });
  closeModal();
  toast(`Se existir uma conta para ${email}, você vai receber um link para criar uma nova senha.`, { type: 'info', timeout: 7000 });
});
function openNewPassword() {
  closeModal();
  openModal({
    title: 'Criar nova senha', size: 'modal-sm',
    html: `<form data-form="new-password" class="stack-form"><label class="field"><span>Nova senha</span><input class="input" type="password" name="password" required minlength="8" autocomplete="new-password" autofocus></label><div class="form-actions"><button class="btn btn-primary" type="submit">Salvar senha</button></div></form>`,
  });
}
onForm('new-password', async (f) => {
  const { error } = await Sync.client.auth.updateUser({ password: formData(f).password });
  if (error) return toast(AUTH_MSG(error), { type: 'error' });
  closeModal(); toast('Senha atualizada.', { type: 'success' });
});
act('auth-signout', () => {

    actions: '<button class="btn btn-ghost" data-act="auth-signout-go" data-wipe="1">Sair e apagar deste navegador</button><button class="btn btn-primary" data-act="auth-signout-go" data-wipe="0">Sair e manter</button>',
  });
});
act('auth-signout-go', async (el) => {
  const wipe = el.dataset.wipe === '1';
  closeModal();
  try { await Sync.client.auth.signOut(); } catch (e) { console.warn(e); }
  Sync.stop(); Sync.set('signedout');
  if (wipe) {
    try { Object.keys(localStorage).filter((k) => k.startsWith(LS_PREFIX)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* sem armazenamento */ }
    S = defaultState(); for (const k of Object.keys(META)) delete META[k]; VERSION++;
    Timer.load(); applyTheme();
  }
  toast(wipe ? 'Você saiu e os dados deste navegador foram apagados.' : 'Você saiu da conta.', { type: 'info' });
  navigate('inicio');
});
act('sync-now', async () => { await Sync.pull(); for (const n of allSliceNames()) if ((META[n] || 0) > (BASE[n] || 0)) Sync.schedule(n, 0); toast('Sincronização concluída.', { type: 'success' }); });

/* Painel de conta exibido em Configurações (versão GitHub). */
function accountPanel() {
  if (!Sync.configured()) {
    return `<p class="sync-line">${icon('hdd')}<span>Esta instalação ainda não tem um Supabase configurado, então os dados ficam só neste navegador. Para sincronizar entre aparelhos, preencha o arquivo <b>config.js</b> seguindo o README.</span></p>`;
  }
  if (!Sync.uid) {
    return `<p class="sync-line sync-${Sync.state}">${icon('users')}<span>${Sync.state === 'offline' ? esc(Sync.msg) : 'Entre na sua conta para sincronizar entre o computador e o celular. Sem entrar, os dados ficam só neste navegador.'}</span></p>
      <div class="btn-row"><button class="btn btn-primary" data-act="auth-open" data-mode="login">${icon('users')}Entrar</button><button class="btn btn-ghost" data-act="auth-open" data-mode="signup">Criar conta</button></div>`;
  }
  return `<p class="sync-line sync-${Sync.state}">${icon(Sync.state === 'synced' ? 'cloud' : Sync.state === 'error' || Sync.state === 'offline' ? 'alert' : 'refresh')}<span>Conectado como <b>${esc(Sync.email)}</b>. ${Sync.state === 'error' || Sync.state === 'offline' ? esc(Sync.msg) : 'Seus dados estão salvos neste navegador e sincronizados com a sua conta.'}</span></p>
    <div class="btn-row"><button class="btn btn-secondary" data-act="sync-now">${icon('refresh')}Sincronizar agora</button><button class="btn btn-ghost" data-act="auth-signout">Sair</button></div>`;
}

/* Convite discreto no Dashboard para entrar na conta. */
function accountBanner() {
  if (TARGET !== 'github' || !Sync.configured() || Sync.state !== 'signedout') return '';
  try { if (localStorage.getItem(LS_PREFIX + 'ui:hideLogin') === '1') return ''; } catch (e) { /* sem armazenamento */ }
  return `<div class="login-banner">${icon('cloud')}<div><b>Sincronize entre seus aparelhos</b><span class="muted small">Entre na sua conta para levar seu progresso para o celular e o computador.</span></div><button class="btn btn-sm btn-primary" data-act="auth-open" data-mode="login">Entrar</button><button class="btn btn-sm btn-text" data-act="hide-login">Agora não</button></div>`;
}
act('hide-login', () => { try { localStorage.setItem(LS_PREFIX + 'ui:hideLogin', '1'); } catch (e) { /* sem armazenamento */ } renderView(); });

/* ---------- PWA: instalação e atualização ---------- */
let INSTALL_PROMPT = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_PROMPT = e; if (CURRENT === 'configuracoes') scheduleRender(); });
window.addEventListener('appinstalled', () => { INSTALL_PROMPT = null; toast('DATAQUEST instalado.', { type: 'success' }); });
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
function installPanel() {
  if (TARGET !== 'github') return '';
  if (isStandalone()) return `<p class="muted small">${icon('checkCircle', 'ic-inline')}O DATAQUEST está instalado neste aparelho e funciona sem internet.</p>`;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `${INSTALL_PROMPT ? `<button class="btn btn-secondary" data-act="install-app">${icon('download')}Instalar o DATAQUEST</button>` : ''}
    <p class="muted small">${ios ? 'No iPhone: abra no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.' : INSTALL_PROMPT ? 'Use o botão acima para instalar.' : 'No Android ou no Chrome do computador: abra o menu do navegador e escolha “Instalar app” (ou “Adicionar à tela inicial”).'} Instalado, ele abre como aplicativo e funciona sem internet; a sincronização acontece quando a conexão voltar.</p>`;
}
act('install-app', async () => { if (!INSTALL_PROMPT) return; INSTALL_PROMPT.prompt(); try { await INSTALL_PROMPT.userChoice; } catch (e) { /* ignorado */ } INSTALL_PROMPT = null; scheduleRender(); });

function registerServiceWorker() {
  if (TARGET !== 'github' || !('serviceWorker' in navigator) || !/^https:|^http:\/\/localhost/.test(location.href)) return;
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    const offer = (w) => toast('Uma nova versão do DATAQUEST está pronta.', { type: 'info', timeout: 15000, action: { label: 'Atualizar', fn: () => w.postMessage('skipWaiting') } });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch((e) => console.warn('service worker', e));
}

/* ---- app.js ---- */
/* ==========================================================================
   DATAQUEST — estrutura, navegação e inicialização
   ========================================================================== */

const NAV = [
  { id: 'inicio', n: 'Dashboard', icon: 'dashboard' },
  { id: 'jornada', n: 'Minha Jornada', icon: 'route' },
  { id: 'plano', n: 'Plano de Estudos', icon: 'list' },
  { id: 'habilidades', n: 'Habilidades', icon: 'tree' },
  { id: 'conhecimento', n: 'Central de Conhecimento', icon: 'library' },
  { id: 'pomodoro', n: 'Pomodoro', icon: 'timer' },
  { id: 'revisao', n: 'Revisão', icon: 'layers' },
  { id: 'projetos', n: 'Projetos Práticos', icon: 'folder' },
  { id: 'estatisticas', n: 'Estatísticas', icon: 'chart' },
  { id: 'conquistas', n: 'Conquistas', icon: 'trophy' },
  { id: 'configuracoes', n: 'Configurações', icon: 'settings' },
];
const BOTTOM = ['inicio', 'pomodoro', 'plano', 'revisao'];

function logo() {
  return `<svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#dq-logo)"/><rect x="8" y="18" width="4" height="6" rx="1.5" fill="#fff" opacity=".7"/><rect x="14" y="13" width="4" height="11" rx="1.5" fill="#fff" opacity=".85"/><rect x="20" y="8" width="4" height="16" rx="1.5" fill="#fff"/></svg>`;
}
function navBadge(id) {
  if (id === 'revisao') { const n = cardStats().dueCount + notesDue().length; return n ? `<span class="nav-badge">${n > 99 ? '99+' : n}</span>` : ''; }
  return '';
}
function buildShell() {
  document.body.innerHTML = `
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="dq-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><linearGradient id="lvgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--primary)"/><stop offset="1" style="stop-color:var(--secondary)"/></linearGradient></defs></svg>
  <a class="skip" href="#view">Pular para o conteúdo</a>
  <div class="app">
    <aside class="side" id="side">
      <div class="side-top"><a class="brand" href="#inicio" data-act="go" data-to="inicio">${logo()}<span>DATAQUEST</span></a><button class="icon-btn side-collapse" data-act="side-toggle" aria-label="Recolher menu">${icon('left')}</button></div>
      <nav class="side-nav" aria-label="Navegação principal">${NAV.map((n) => `<a href="#${n.id}" class="nav-item" data-act="go" data-to="${n.id}" data-nav="${n.id}">${icon(n.icon)}<span>${n.n}</span><b class="nav-b" data-badge="${n.id}"></b></a>`).join('')}</nav>
      <div class="side-foot"><div id="side-level"></div><button class="sync-badge" id="sync-badge" data-act="go" data-to="configuracoes"></button></div>
    </aside>
    <div class="main">
      <header class="topbar"><a class="brand" href="#inicio" data-act="go" data-to="inicio">${logo()}<span>DATAQUEST</span></a><div class="spacer"></div>
        <button class="timer-pill" id="timer-pill" data-act="go" data-to="pomodoro" hidden>${icon('timer')}<b>00:00</b></button><div class="top-level" id="top-level"></div></header>
      <button class="timer-pill timer-float" id="timer-pill-d" data-act="go" data-to="pomodoro" hidden>${icon('timer')}<b>00:00</b></button>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="bottom" aria-label="Navegação">${BOTTOM.map((id) => { const n = NAV.find((x) => x.id === id); return `<a href="#${id}" class="bn-item" data-act="go" data-to="${id}" data-nav="${id}">${icon(n.icon)}<span>${id === 'inicio' ? 'Início' : id === 'plano' ? 'Plano' : n.n}</span><b class="nav-b" data-badge="${id}"></b></a>`; }).join('')}<button class="bn-item" data-act="more-sheet" data-nav="more">${icon('more')}<span>Mais</span></button></nav>
    <div class="sheet" id="more-sheet" hidden><div class="sheet-backdrop" data-act="more-close"></div><div class="sheet-panel"><div class="sheet-grip"></div><div class="sheet-grid">${NAV.filter((n) => !BOTTOM.includes(n.id)).map((n) => `<a href="#${n.id}" data-act="go" data-to="${n.id}" class="sheet-item">${icon(n.icon)}<span>${n.n}</span></a>`).join('')}</div></div></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="drawer" class="drawer"></div>
  <div id="focus" class="focus"></div>
  <div id="tip" class="tip" role="tooltip"></div>`;
  try { if (localStorage.getItem(LS_PREFIX + 'ui:collapsed') === '1') document.body.classList.add('side-collapsed'); } catch (e) { /* sem armazenamento */ }
}
act('side-toggle', () => { document.body.classList.toggle('side-collapsed'); try { localStorage.setItem(LS_PREFIX + 'ui:collapsed', document.body.classList.contains('side-collapsed') ? '1' : '0'); } catch (e) { /* sem armazenamento */ } if (CURRENT === 'habilidades') setTimeout(drawTreeLines, 260); });
act('more-sheet', () => { const s = $('#more-sheet'); s.hidden = false; requestAnimationFrame(() => s.classList.add('open')); });
act('more-close', closeMoreSheet);
function closeMoreSheet() { const s = $('#more-sheet'); if (!s || s.hidden) return; s.classList.remove('open'); setTimeout(() => { s.hidden = true; }, 220); }

function renderChrome() {
  $$('[data-nav]').forEach((el) => {
    const on = el.dataset.nav === CURRENT || (el.dataset.nav === 'more' && !BOTTOM.includes(CURRENT));
    el.classList.toggle('on', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
  $$('[data-badge]').forEach((el) => { el.innerHTML = navBadge(el.dataset.badge); });
  const li = levelInfo(), st = streaks();
  const lvHtml = `<div class="mini-level" data-act="go" data-to="conquistas" role="button" tabindex="0" title="Nível ${li.lv}: ${esc(li.name)}">${ring(li.pct, { size: 38, stroke: 4, color: 'url(#lvgrad)', inner: `<b>${li.lv}</b>` })}<div><b>${esc(li.name)}</b><span>${nf(li.xp)} XP</span></div><span class="mini-streak ${st.todayDone ? 'lit' : ''}">${icon('flame')}${st.current}</span></div>`;
  const sl = $('#side-level'); if (sl) sl.innerHTML = lvHtml;
  const tl = $('#top-level'); if (tl) tl.innerHTML = `<button class="xp-chip" data-act="go" data-to="conquistas" aria-label="Nível ${li.lv}, ${nf(li.xp)} XP"><span class="lv-badge">${li.lv}</span><b>${nf(li.xp)}</b><span>XP</span></button><span class="mini-streak ${st.todayDone ? 'lit' : ''}" title="Sequência atual">${icon('flame')}${st.current}</span>`;
  renderSyncBadge();
  updateTimerDom();
}
function renderSyncBadge() {
  const b = $('#sync-badge'); if (!b) return;
  const map = { signedout: ['users', 'Entre para sincronizar'], local: ['hdd', 'Salvo neste navegador'], connecting: ['refresh', 'Conectando à conta'], synced: ['cloud', 'Sincronizado com a conta'], saving: ['refresh', 'Salvando…'], offline: ['cloudOff', 'Sem conexão: salvo aqui'], error: ['alert', 'Erro ao sincronizar'] };
  const [ic, label] = map[Sync.state] || map.local;
  b.className = `sync-badge sync-${Sync.state}`;
  b.innerHTML = `${icon(ic)}<span>${label}</span>`;
  b.title = Sync.msg || label;
}

/* ---------- tema ---------- */
const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = (S && S.core.settings.theme) || 'dark';
  const resolved = t === 'system' ? (mqDark.matches ? 'dark' : 'light') : t;
  document.documentElement.setAttribute('data-theme', resolved);
  const meta = $('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', resolved === 'dark' ? '#090D16' : '#F5F7FB');
}
mqDark.addEventListener && mqDark.addEventListener('change', () => { if (S && S.core.settings.theme === 'system') applyTheme(); });

/* ---------- inicialização ---------- */
function boot() {
  loadLocal();
  Timer.load();
  applyTheme();
  buildShell();
  const h = location.hash.slice(1);
  const authRedirect = /(^|&)(access_token|error|error_description|type)=/.test(h);
  CURRENT = VIEWS[h] ? h : 'inicio';
  if (!authRedirect && (!h || !VIEWS[h])) history.replaceState(null, '', '#' + CURRENT);
  renderView();
  if (!LS_OK) toast('O armazenamento deste navegador está bloqueado. Seus dados ficam só nesta aba até você exportar um backup.', { type: 'warn', timeout: 9000 });
  setInterval(() => Timer.tick(), 500);
  Timer.tick();
  let lastDay = todayKey();
  setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); VERSION++; scheduleRender(); } }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Timer.tick(); if (todayKey() !== lastDay) { lastDay = todayKey(); VERSION++; scheduleRender(); } } });
  checkAchievements();
  let onbShown = false;
  const showOnb = () => { if (onbShown || S.core.onboarded || modalStack.length) return; onbShown = true; onboarding(); };
  Sync.init().finally(() => { if (location.hash.includes('=')) history.replaceState(null, '', location.pathname + location.search.replace(/[?&]code=[^&]*/, '') + '#' + CURRENT); showOnb(); });
  registerServiceWorker();
  setTimeout(showOnb, 2500);
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[role="button"][data-act]');
  if (el && el.tagName !== 'BUTTON') { e.preventDefault(); el.click(); }
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
