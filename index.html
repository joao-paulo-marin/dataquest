<head>

<style>
/* ==========================================================================
   DATAQUEST — estilos
   Tipografia: Sora (títulos e números) + Figtree (interface)
   ========================================================================== */

:root {
  --bg: #F5F7FB; --surface: #FFFFFF; --surface-2: #EEF2F8; --surface-3: #E3E9F3;
  --border: rgba(15, 23, 42, .09); --border-strong: rgba(15, 23, 42, .16);
  --text: #0F172A; --muted: #64748B; --faint: #94A3B8;
  --primary: #7C3AED; --primary-strong: #6D28D9; --primary-soft: rgba(124, 58, 237, .10); --on-primary: #FFFFFF;
  --secondary: #0284C7; --secondary-soft: rgba(2, 132, 199, .10);
  --success: #16A34A; --success-soft: rgba(22, 163, 74, .12);
  --warning: #D97706; --warning-soft: rgba(217, 119, 6, .12);
  --danger: #E11D48; --danger-soft: rgba(225, 29, 72, .10);
  --ring-track: rgba(15, 23, 42, .08);
  --hm0: #E8ECF2; --hm1: #BBF7D0; --hm2: #4ADE80; --hm3: #16A34A; --hm4: #15803D;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
  --shadow-lg: 0 24px 64px rgba(15, 23, 42, .18);
  --overlay: rgba(15, 23, 42, .45);
  --font-ui: 'Figtree', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --font-display: 'Sora', 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --side-w: 252px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D16; --surface: #111827; --surface-2: #192235; --surface-3: #212C44;
    --border: rgba(148, 163, 184, .12); --border-strong: rgba(148, 163, 184, .22);
    --text: #F8FAFC; --muted: #94A3B8; --faint: #64748B;
    --primary: #8B5CF6; --primary-strong: #7C3AED; --primary-soft: rgba(139, 92, 246, .16); --on-primary: #FFFFFF;
    --secondary: #38BDF8; --secondary-soft: rgba(56, 189, 248, .14);
    --success: #22C55E; --success-soft: rgba(34, 197, 94, .14);
    --warning: #F59E0B; --warning-soft: rgba(245, 158, 11, .14);
    --danger: #F43F5E; --danger-soft: rgba(244, 63, 94, .14);
    --ring-track: rgba(148, 163, 184, .14);
    --hm0: #161F31; --hm1: #123A2A; --hm2: #166534; --hm3: #16A34A; --hm4: #4ADE80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
    --shadow-lg: 0 30px 80px rgba(0, 0, 0, .55);
    --overlay: rgba(3, 6, 12, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090D16; --surface: #111827; --surface-2: #192235; --surface-3: #212C44;
  --border: rgba(148, 163, 184, .12); --border-strong: rgba(148, 163, 184, .22);
  --text: #F8FAFC; --muted: #94A3B8; --faint: #64748B;
  --primary: #8B5CF6; --primary-strong: #7C3AED; --primary-soft: rgba(139, 92, 246, .16); --on-primary: #FFFFFF;
  --secondary: #38BDF8; --secondary-soft: rgba(56, 189, 248, .14);
  --success: #22C55E; --success-soft: rgba(34, 197, 94, .14);
  --warning: #F59E0B; --warning-soft: rgba(245, 158, 11, .14);
  --danger: #F43F5E; --danger-soft: rgba(244, 63, 94, .14);
  --ring-track: rgba(148, 163, 184, .14);
  --hm0: #161F31; --hm1: #123A2A; --hm2: #166534; --hm3: #16A34A; --hm4: #4ADE80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, .55);
  --overlay: rgba(3, 6, 12, .66);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.25; }
h1 { font-size: 28px; letter-spacing: -.02em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0 0 .6em; }
a { color: var(--secondary); text-decoration: none; }
a:hover { text-decoration: underline; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; border-radius: 6px; }
.ic { width: 18px; height: 18px; flex: none; }
.ic-xs { width: 13px; height: 13px; margin-left: 4px; vertical-align: -1px; opacity: .7; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.ok { color: var(--success); }
.warn { color: var(--warning); }
.mono { font-family: var(--mono); font-size: 13px; }
.lead { font-size: 16px; font-weight: 500; }
.spacer { flex: 1; }
.big { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.h3 { margin: 18px 0 8px; font-size: 14px; color: var(--muted); font-family: var(--font-ui); font-weight: 600; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--primary); color: #fff; padding: 8px 14px; border-radius: 8px; }
.skip:focus { left: 8px; }
hr.sep { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
kbd { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border-strong); color: var(--muted); }

/* ---------- estrutura ---------- */
.side { position: fixed; top: 0; bottom: 0; left: 0; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 30; transition: width .22s ease; }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 14px 14px 18px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; font-size: 15px; }
.brand:hover { text-decoration: none; }
.logo-mark { width: 30px; height: 30px; flex: none; }
.side-nav { flex: 1; overflow-y: auto; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-weight: 500; position: relative; white-space: nowrap; }
.nav-item:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.nav-item.on { background: var(--primary-soft); color: var(--text); }
.nav-item.on .ic { color: var(--primary); }
.nav-item.on::before { content: ''; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--primary); }
.nav-b { margin-left: auto; }
.nav-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; }
.side-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.mini-level { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: var(--surface-2); cursor: pointer; }
.mini-level > div:nth-child(2) { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.mini-level b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-level span { font-size: 12px; color: var(--muted); }
.mini-streak { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 13px; color: var(--muted); }
.mini-streak .ic { width: 16px; height: 16px; }
.mini-streak.lit, .streak.lit { color: var(--warning); }
.sync-badge { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; border-radius: 8px; text-align: left; }
.sync-badge:hover { background: var(--surface-2); }
.sync-badge .ic { width: 15px; height: 15px; }
.sync-synced .ic { color: var(--success); }
.sync-saving .ic, .sync-connecting .ic { color: var(--secondary); animation: spin 1.2s linear infinite; }
.sync-error .ic, .sync-offline .ic { color: var(--warning); }
@keyframes spin { to { transform: rotate(360deg); } }
.side-collapsed { --side-w: 76px; }
.side-collapsed .side .brand span, .side-collapsed .nav-item span, .side-collapsed .mini-level > div:nth-child(2), .side-collapsed .sync-badge span, .side-collapsed .mini-streak { display: none; }
.side-collapsed .side-top { flex-direction: column; gap: 10px; padding: 16px 0; }
.side-collapsed .side-collapse { transform: rotate(180deg); }
.side-collapsed .nav-item { justify-content: center; padding: 10px; }
.side-collapsed .nav-b { position: absolute; top: 2px; right: 4px; }
.side-collapsed .mini-level { justify-content: center; background: none; }
.side-collapsed .sync-badge { justify-content: center; }
.main { margin-left: var(--side-w); padding: 28px 36px 72px; transition: margin-left .22s ease; min-height: 100vh; }
.view { max-width: 1240px; margin: 0 auto; outline: none; }
.view.enter { animation: viewIn .28s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.topbar { display: none; }
.bottom { display: none; }
.timer-float { position: fixed; right: 24px; bottom: 24px; z-index: 25; box-shadow: var(--shadow-lg); }

/* ---------- elementos básicos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s, transform .08s; white-space: nowrap; text-decoration: none; }
.btn:hover { text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn .ic { width: 17px; height: 17px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 18px -8px var(--primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-strong); }
.btn-secondary { background: var(--surface-3); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--border-strong); }
.btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-text { background: none; color: var(--muted); padding: 0 8px; }
.btn-text:hover:not(:disabled) { color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-text { color: var(--danger); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn .small { font-weight: 500; opacity: .75; margin-left: 4px; }
.btn-link { background: none; border: 0; padding: 0; color: var(--secondary); cursor: pointer; font-weight: 500; text-align: left; }
.btn-link:hover { text-decoration: underline; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 0; background: none; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.input { width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
textarea.input { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
select.input { padding-right: 32px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select.input[multiple] { background-image: none; padding: 6px; height: auto; }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.input:disabled { opacity: .6; }
.input-sm { height: 32px; font-size: 13px; padding: 0 10px; border-radius: 8px; }
select.input-sm { padding-right: 28px; }
.input-suffix { display: flex; align-items: center; gap: 8px; }
.input-suffix em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.field > span { color: var(--muted); }
.field em { font-style: normal; }
.field-inline { flex-direction: row; align-items: center; gap: 10px; }
.field-inline .input { width: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.span-2 { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.stack-form { display: flex; flex-direction: column; gap: 12px; }
.inline-form { display: flex; gap: 8px; align-items: center; }
.inline-form .input { flex: 1; }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--text); font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); flex: none; }
.switch { display: flex; align-items: center; gap: 12px; margin: 10px 0; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch i { width: 38px; height: 22px; border-radius: 11px; background: var(--surface-3); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + i { background: var(--primary); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--secondary); outline-offset: 2px; }
.switch span { display: flex; flex-direction: column; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip .ic { width: 14px; height: 14px; }
.chip-xs { height: 18px; padding: 0 7px; font-size: 11px; font-style: normal; }
.chip-primary { background: var(--primary-soft); color: var(--primary); }
.chip-ok { background: var(--success-soft); color: var(--success); }
.chip-warn { background: var(--warning-soft); color: var(--warning); }
.chip-track i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip-btn { cursor: pointer; height: 32px; padding: 0 14px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); font-size: 13px; }
.chip-btn:hover { background: var(--surface-2); }
.chip-btn.on { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cat-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 4px 0 18px; scrollbar-width: thin; }
.bar { height: 8px; border-radius: 99px; background: var(--ring-track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar-thin { height: 5px; }
.pips { display: inline-flex; gap: 3px; flex: none; }
.pips i { width: 9px; height: 9px; border-radius: 3px; background: var(--ring-track); }
.pips i.on { background: var(--primary); }
.stars { display: inline-flex; }
.star { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--faint); }
.star .ic { width: 16px; height: 16px; }
.star.on { color: var(--warning); }
.star.on .ic { fill: currentColor; }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring-fg { transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1); }
.ring-in { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.1; text-align: center; }
.ring-in b { font-family: var(--font-display); font-size: 14px; }
.ring-in strong { font-family: var(--font-display); font-size: 20px; }
.ring-in span { font-size: 12px; color: var(--muted); }
.ring-in .lv-num { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--text); line-height: 1; }
.ring-in .lv-big { font-size: 40px; }

/* ---------- painéis e cabeçalhos ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head p { margin: 6px 0 0; max-width: 70ch; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.page-actions-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-actions-row p { margin: 0; max-width: 70ch; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 20px; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-head p { margin: 4px 0 0; }
.panel-actions { display: flex; gap: 8px; align-items: center; }
.stack > .panel:last-child { margin-bottom: 0; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.stack > .panel { margin-bottom: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 20px; }
.grid-2 > .panel { margin-bottom: 0; }
.grid-hero { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 20px; margin-bottom: 20px; }
.grid-hero > .panel { margin-bottom: 0; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 16px; gap: 6px; }
.empty > .ic { width: 34px; height: 34px; color: var(--faint); margin-bottom: 6px; }
.empty p { max-width: 42ch; }
.empty .btn { margin-top: 8px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button.on { background: var(--surface-3); color: var(--text); }
.tab-body { min-height: 200px; }

/* faixa de indicadores: uma única faixa com divisórias, não cartões soltos */
.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 20px; overflow: hidden; }
.kpi-strip-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.kpi { display: flex; gap: 12px; padding: 16px 18px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 0 -1px -1px 0; }
.kpi > div { display: flex; flex-direction: column; min-width: 0; }
.kpi-ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); color: var(--muted); flex: none; }
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi-value { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.delta { font-size: 12px; color: var(--muted); }
.delta.up { color: var(--success); }
.delta.down { color: var(--warning); }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.list-plain li:last-child { border-bottom: 0; }
.list-plain li > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.list-plain li > span em { font-style: normal; }

/* ---------- dashboard ---------- */
.dash-head { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 24px; flex-wrap: wrap; }
.dash-greet h1 { font-size: 34px; margin: 4px 0 6px; }
.dash-greet p { color: var(--muted); font-size: 16px; margin: 0; max-width: 60ch; }
.level-card { display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); min-width: 330px; }
.level-meta { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.level-meta strong { font-family: var(--font-display); font-size: 16px; }
.streak { display: flex; flex-direction: column; align-items: center; color: var(--muted); padding-left: 14px; border-left: 1px solid var(--border); }
.streak .ic { width: 22px; height: 22px; }
.streak b { font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.streak span { font-size: 11px; }
.mission { position: relative; padding: 24px; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--primary), var(--secondary) 60%, transparent) border-box; border: 1px solid transparent; overflow: hidden; }
.mission::after { content: ''; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, var(--primary-soft), transparent 70%); pointer-events: none; }
.mission.is-done { background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--success), transparent 70%) border-box; }
.mission-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.mission-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: var(--primary); }
.mission.is-done .mission-tag { color: var(--success); }
.mission-title { font-size: 24px; letter-spacing: -.02em; margin-bottom: 8px; max-width: 30ch; }
.mission-reason { color: var(--muted); max-width: 62ch; }
.mission-meta { display: flex; flex-wrap: wrap; gap: 18px; margin: 14px 0; font-size: 14px; color: var(--muted); }
.mission-meta span { display: inline-flex; align-items: center; gap: 6px; }
.mission-meta b { color: var(--text); }
.mission-prog { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.mission-prog .bar { flex: 1; max-width: 360px; }
.mission-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: relative; z-index: 1; }
.mission-review { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted); position: relative; z-index: 1; }
.mission-review span { flex: 1; }
.mission-review.is-done .ic { color: var(--success); }
.goal-card { display: flex; flex-direction: column; }
.goal-body { display: grid; place-items: center; padding: 6px 0 12px; flex: 1; }
.goal-xp { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px; }
.goal-xp .ic { color: var(--warning); width: 16px; height: 16px; }
.dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.dim { padding: 16px; border-radius: var(--r-md); background: var(--surface-2); }
.dim-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dim-top b { flex: 1; }
.dim-top strong { font-family: var(--font-display); font-size: 22px; }
.dim-ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.dim-lines { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.insight { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0 0; padding: 12px 14px; border-radius: var(--r-md); background: var(--secondary-soft); font-size: 14px; }
.insight .ic { color: var(--secondary); margin-top: 2px; }
.next-unlock { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--border-strong); border-radius: var(--r-md); }
.next-unlock > .ic { color: var(--warning); width: 22px; height: 22px; }
.next-unlock > div { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.next-unlock.banner { margin: 0 0 18px; background: var(--surface); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; gap: 12px; padding: 10px 0; position: relative; }
.timeline li:not(:last-child)::after { content: ''; position: absolute; left: 15px; top: 42px; bottom: -4px; width: 1px; background: var(--border); }
.timeline li > div { display: flex; flex-direction: column; min-width: 0; }
.tl-ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); color: var(--muted); flex: none; }
.tl-ic .ic { width: 16px; height: 16px; }
.today-list { list-style: none; margin: 0; padding: 0; }
.today-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.today-list li:last-child { border-bottom: 0; }
.today-list li > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.mini-skills, .mini-projects { list-style: none; margin: 0; padding: 0; }
.mini-skills li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.mini-skills li:hover, .mini-projects li:hover { background: var(--surface-2); }
.mini-projects li { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; cursor: pointer; }

/* ---------- calendário de contribuições ---------- */
.heatmap { overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.hm-inner { display: grid; grid-template-columns: 30px auto; grid-template-rows: auto auto; gap: 4px 6px; width: max-content; }
.hm-months { grid-column: 2; display: grid; grid-template-columns: repeat(var(--cols), 13px); gap: 3px; font-size: 11px; color: var(--muted); height: 16px; }
.hm-months span { white-space: nowrap; }
.hm-days { grid-row: 2; display: grid; grid-template-rows: repeat(7, 13px); gap: 3px; font-size: 10px; color: var(--muted); line-height: 13px; }
.hm-grid { grid-row: 2; grid-column: 2; display: grid; grid-template-rows: repeat(7, 13px); grid-template-columns: repeat(var(--cols), 13px); gap: 3px; }
.hm-cell { width: 13px; height: 13px; border-radius: 3px; border: 0; padding: 0; background: var(--hm0); cursor: pointer; display: block; }
button.hm-cell:hover { outline: 2px solid var(--text); outline-offset: 1px; }
.hm-cell.l1 { background: var(--hm1); }
.hm-cell.l2 { background: var(--hm2); }
.hm-cell.l3 { background: var(--hm3); }
.hm-cell.l4 { background: var(--hm4); }
.hm-cell.today { box-shadow: 0 0 0 1.5px var(--secondary); }
.hm-void { background: transparent; cursor: default; }
.hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.hm-legend i.hm-cell { cursor: default; }
.hm-scale { margin-left: 12px; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 9px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 260px; box-shadow: var(--shadow-lg); }
.tip.show { opacity: 1; transform: none; }
.tip .muted { color: inherit; opacity: .7; }

/* ---------- jornada e relatórios ---------- */
.period-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.period-nav > div:not(.spacer) { display: flex; flex-direction: column; }
.period-nav b { font-family: var(--font-display); font-size: 16px; }
.report-h { font-size: 15px; color: var(--muted); font-family: var(--font-ui); font-weight: 700; margin: 26px 0 12px; }
.report-h:first-child { margin-top: 0; }
.goal-line { display: flex; align-items: center; gap: 14px; margin: -6px 0 8px; font-size: 14px; }
.goal-line .bar { flex: 1; }
.diag { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.diag-q { padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.diag-q b { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.reco-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.reco-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.reco-list .ic { color: var(--primary); margin-top: 2px; }
.levels { list-style: none; margin: 0; padding: 0; }
.levels li { display: flex; align-items: center; gap: 14px; padding: 10px 6px; border-bottom: 1px solid var(--border); color: var(--muted); }
.levels li > div { display: flex; flex-direction: column; flex: 1; }
.levels li.past { color: var(--text); }
.levels li.past .lv-dot { background: var(--primary-soft); color: var(--primary); }
.levels li.now { color: var(--text); }
.levels li.now .lv-dot { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
.lv-dot { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-display); font-weight: 700; flex: none; }
.levelup { text-align: center; padding: 10px 0; }
.levelup-badge { width: 110px; height: 110px; margin: 6px auto 16px; border-radius: 30px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-family: var(--font-display); font-size: 48px; font-weight: 700; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; box-shadow: 0 20px 50px -12px var(--primary); }
.levelup h3 { font-size: 22px; margin-bottom: 8px; }
@keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- gráficos ---------- */
.chart-box { position: relative; width: 100%; }
.ch-plot { position: absolute; left: 46px; right: 6px; top: 8px; bottom: 24px; }
.ch-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
.ch-grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ch-y { position: absolute; right: calc(100% + 8px); transform: translateY(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.ch-x { position: absolute; top: calc(100% + 6px); transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.ch-x.first { transform: none; }
.ch-x.last { transform: translateX(-100%); }
.ch-bar:hover rect:last-of-type { opacity: .8; }
.ch-band:hover { fill: var(--primary-soft); }
.chart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 160px; color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; }
.chart-empty .ic { width: 28px; height: 28px; color: var(--faint); }
.donut { display: flex; align-items: center; gap: 22px; }
.donut svg { width: 150px; height: 150px; flex: none; }
.donut-total { fill: var(--text); font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.donut-sub { fill: var(--muted); font-size: 8px; }
.legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend em { font-style: normal; color: var(--muted); text-align: right; }
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.hb-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; gap: 12px; }
.hb-top b { color: var(--muted); font-weight: 500; text-align: right; }

/* ---------- plano: trilhas ---------- */
.tracks { display: flex; flex-direction: column; gap: 12px; }
.track { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.track > .bar { border-radius: 0; height: 3px; background: var(--surface-2); }
.track-head { display: flex; align-items: center; gap: 16px; padding: 16px 18px; cursor: pointer; }
.track-head:hover { background: var(--surface-2); }
.track-num { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; font-family: var(--font-display); font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); flex: none; }
.track-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.track-stats { display: flex; gap: 22px; }
.track-stats > div { display: flex; flex-direction: column; align-items: flex-end; }
.track-stats strong { font-family: var(--font-display); font-size: 17px; }
.track-chev { color: var(--muted); transition: transform .2s; }
.track.open .track-chev { transform: rotate(180deg); }
.track-next { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 18px; color: var(--muted); border-top: 1px solid var(--border); }
.track-next .ic { width: 16px; height: 16px; }
.topics { list-style: none; margin: 0; padding: 4px 10px 10px; border-top: 1px solid var(--border); }
.topic { display: grid; grid-template-columns: minmax(0, 1fr) auto 150px auto; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 10px; }
.topic:hover { background: var(--surface-2); }
.topic-name { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 500; color: var(--text); min-width: 0; }
.topic-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topic-name .ic { width: 15px; height: 15px; color: var(--faint); }
.topic.is-locked .topic-name { color: var(--muted); }
.topic-status.st-done { color: var(--success); }
.topic-status.st-doing { color: var(--secondary); }
.topic-status.st-review { color: var(--warning); }
.topic-sug { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; color: var(--secondary); margin: -2px 0 2px; }
.topic-sug .ic { width: 14px; height: 14px; }

/* ---------- plano: semana e mês ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px; min-height: 220px; display: flex; flex-direction: column; transition: border-color .15s, background .15s; }
.day.is-today { border-color: var(--primary); }
.day.drop-over { background: var(--primary-soft); border-style: dashed; border-color: var(--primary); }
.day header { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.day header b { font-family: var(--font-display); }
.day-load { display: flex; flex-direction: column; margin: 4px 0 8px; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: start; padding: 8px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--c); cursor: grab; position: relative; }
.task.dragging { opacity: .4; }
.task.done { opacity: .55; }
.task.done b { text-decoration: line-through; }
.task.pop { animation: pop .4s ease; }
.task-check { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); margin-top: 1px; }
.task.done .task-check { color: var(--success); }
.task-main { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.task-main b { font-weight: 600; overflow-wrap: anywhere; }
.task-prio { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; }
.task-actions { grid-column: 2 / -1; display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity .15s; }
.task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
.task-actions .icon-btn { width: 28px; height: 28px; }
.task-actions .ic { width: 15px; height: 15px; }
.day-add { margin-top: 6px; align-self: flex-start; }
.tasks-modal { margin-bottom: 14px; }
.tasks-modal .task-actions { opacity: 1; }
.month { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.month-head { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; color: var(--muted); font-weight: 600; }
.month-head span { padding: 10px; }
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.mday { min-height: 104px; border: 0; border-top: 1px solid var(--border); border-right: 1px solid var(--border); background: none; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; color: var(--text); min-width: 0; }
.mday:nth-child(7n) { border-right: 0; }
.mday:hover { background: var(--surface-2); }
.mday.other { color: var(--faint); }
.mday.is-today .mday-n { background: var(--primary); color: #fff; }
.mday-n { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; font-weight: 600; font-size: 13px; }
.mday-min { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; align-self: flex-start; background: var(--hm1); color: var(--text); }
.mday-min.l3, .mday-min.l4 { background: var(--hm3); color: #fff; }
.mday-tasks { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mday-tasks i { font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 5px; border-left: 2px solid var(--c); background: var(--surface-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mday-tasks i.done { text-decoration: line-through; opacity: .6; }
.mday-tasks em { font-size: 11px; color: var(--muted); font-style: normal; }
.plan-list { display: flex; flex-direction: column; gap: 14px; }
.plan-day { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.plan-day > b { font-size: 13px; color: var(--muted); }
.plan-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); cursor: pointer; font-size: 14px; flex-wrap: wrap; }
.plan-item input { accent-color: var(--primary); width: 17px; height: 17px; }
.plan-item span { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.plan-item em { font-style: normal; color: var(--muted); font-size: 12px; }
.plan-overflow { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1px dashed var(--border-strong); }
.tpl-week { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }

/* ---------- árvore de habilidades ---------- */
.tree-summary { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-item .ic { width: 15px; height: 15px; }
.tree-wrap { position: relative; overflow-x: auto; background: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0 / 22px 22px, var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; margin-bottom: 20px; }
.tree { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(var(--cols), minmax(196px, 250px)); gap: 0 44px; align-items: center; justify-content: space-between; min-width: max-content; }
.tier { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.tier-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.tree-lines { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; overflow: visible; max-width: none; }
.tree-lines path { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 5 5; }
.tree-lines path.on { stroke: var(--g); stroke-dasharray: none; opacity: .7; }
.node { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--surface-2); text-align: left; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; color: var(--text); }
.node:hover { transform: translateY(-2px); border-color: var(--g); }
.node-ic { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--surface-3); color: var(--muted); flex: none; }
.node-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.node-body b { font-size: 14px; line-height: 1.25; }
.node-req { font-size: 11px; color: var(--muted); line-height: 1.3; }
.node.st-locked { opacity: .55; border-style: dashed; background: transparent; }
.node.st-locked .pips i.on { background: var(--faint); }
.node.st-available { border-color: color-mix(in srgb, var(--g) 50%, transparent); }
.node.st-available .node-ic { color: var(--g); }
.node.st-developing .node-ic { background: color-mix(in srgb, var(--g) 18%, transparent); color: var(--g); }
.node.st-developing .pips i.on { background: var(--g); }
.node.st-mastered { border-color: var(--g); background: linear-gradient(135deg, color-mix(in srgb, var(--g) 22%, var(--surface-2)), var(--surface-2)); box-shadow: 0 10px 30px -14px var(--g); }
.node.st-mastered .node-ic { background: var(--g); color: #fff; }
.node.st-mastered .pips i.on { background: var(--g); }
.node.st-review { border-color: var(--warning); }
.node.st-review .node-ic { color: var(--warning); background: var(--warning-soft); }
.st-locked .ic { color: var(--faint); }
.st-mastered > .ic { color: var(--success); }
.st-review > .ic { color: var(--warning); }
.help summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; list-style: none; }
.help summary::-webkit-details-marker { display: none; }
.mastery-scale { margin: 14px 0; padding-left: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.mastery-scale li { display: flex; flex-direction: column; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }

/* ---------- painel lateral ---------- */
.drawer { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.drawer.open { pointer-events: auto; }
.drawer-backdrop { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .22s; }
.drawer.open .drawer-backdrop { opacity: 1; }
.drawer-panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.open .drawer-panel { transform: none; }
.drawer-head { display: flex; gap: 14px; align-items: flex-start; padding: 20px; border-bottom: 1px solid var(--border); }
.drawer-head > div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.drawer-head h2 { font-size: 20px; }
.drawer-ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--g); background: color-mix(in srgb, var(--g) 16%, transparent); flex: none; }
.state-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; align-self: flex-start; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.state-badge .ic { width: 14px; height: 14px; }
.state-badge.st-mastered { background: var(--success-soft); color: var(--success); }
.state-badge.st-developing { background: var(--primary-soft); color: var(--primary); }
.state-badge.st-available { background: var(--secondary-soft); color: var(--secondary); }
.state-badge.st-review { background: var(--warning-soft); color: var(--warning); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; }
.drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.dsec { padding: 16px 0; border-top: 1px solid var(--border); margin-top: 12px; }
.dsec h3 { font-size: 13px; color: var(--muted); font-family: var(--font-ui); font-weight: 700; margin-bottom: 10px; }
.mastery-now { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.level-form { display: flex; gap: 8px; margin-bottom: 8px; }
.dgrid { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin: 12px 0; }
.dgrid .input { width: auto; justify-self: start; }
.req-list { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; gap: 6px; }
.req-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.req-list li .btn-link { flex: 1; }
.req-list li > .ic { color: var(--faint); width: 16px; height: 16px; }
.req-list li.ok > .ic { color: var(--success); }
.crit, .assoc, .evid, .hist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.crit li, .assoc li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.crit .ic, .assoc .ic { color: var(--muted); width: 16px; height: 16px; margin-top: 3px; }
.evid li { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--surface-2); }
.evid li > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.evid .ic { color: var(--primary); margin-top: 2px; }
.hist li { display: grid; grid-template-columns: 56px 64px 1fr; gap: 8px; align-items: baseline; font-size: 14px; }

/* ---------- Pomodoro ---------- */
.grid-pomo { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
.tm-panel { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; margin-bottom: 0; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); flex-wrap: wrap; justify-content: center; }
.seg button { display: flex; flex-direction: column; align-items: center; padding: 8px 14px; border: 0; border-radius: 10px; background: none; cursor: pointer; color: var(--muted); min-width: 92px; }
.seg button b { font-size: 13px; }
.seg button span { font-size: 11px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg button:disabled { cursor: not-allowed; }
.seg.is-locked button:not(.on) { opacity: .45; }
.tm-ring { position: relative; width: min(280px, 72vw); aspect-ratio: 1; }
.tm-ring svg { width: 100%; height: 100%; }
.tm-ring svg circle[data-tm="ring"] { transition: stroke-dashoffset .5s linear; }
.tm-ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.tm-phase { font-size: 14px; color: var(--muted); font-weight: 600; }
.tm-clock { font-family: var(--font-display); font-size: clamp(48px, 13vw, 64px); font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tm-cycle { display: flex; gap: 6px; margin-top: 6px; }
.tm-cycle i { width: 8px; height: 8px; border-radius: 50%; background: var(--ring-track); }
.tm-cycle i.on { background: var(--primary); }
.tm-subject { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
.tm-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.today-goal { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.today-goal > div:last-child { display: flex; flex-direction: column; }
.panel-scroll { max-height: 560px; overflow-y: auto; }
.sess-list { list-style: none; margin: 0; padding: 0; }
.sess-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto 34px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.sess-row:last-child { border-bottom: 0; }
.sess-row > div { display: flex; flex-direction: column; min-width: 0; }
.sess-row > div b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.sess-row strong { font-family: var(--font-display); font-size: 14px; }
.sess-row em { font-style: normal; }
.sess-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.timer-pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; border: 0; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.timer-pill.is-break { background: var(--secondary); }
.timer-pill .ic { width: 16px; height: 16px; }
.focus { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.focus.open { display: block; animation: viewIn .3s ease; }
.focus-inner { height: 100%; display: flex; flex-direction: column; padding: 24px; max-width: 900px; margin: 0 auto; }
.focus-top { display: flex; justify-content: space-between; align-items: center; }
.focus-now { font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.focus-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.focus-phase { color: var(--muted); font-weight: 600; }
.focus-clock { font-family: var(--font-display); font-size: clamp(80px, 22vw, 168px); font-weight: 600; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.focus-goal { font-size: 18px; max-width: 40ch; }
.focus-bar { width: min(420px, 80vw); }
.focus-bar i { background: linear-gradient(90deg, var(--primary), var(--secondary)); }
.focus-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 12px; }
.focus-open { overflow: hidden; }

/* ---------- revisão ---------- */
.review-cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.review-cta p { margin: 4px 0 0; max-width: 64ch; }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.deck { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); border-left: 3px solid var(--c); }
.deck > div:first-child { display: flex; flex-direction: column; min-width: 0; }
.deck-actions { display: flex; gap: 4px; align-items: center; }
.card-list { list-style: none; margin: 0; padding: 0; }
.card-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.card-list li > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.modal.modal-study { width: min(680px, 100%); }
.study-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.study-top .bar { flex: 1; }
.flip { perspective: 1400px; cursor: pointer; min-height: 280px; margin-bottom: 20px; outline: none; }
.flip-inner { position: relative; width: 100%; min-height: 280px; transition: transform .5s cubic-bezier(.2, .8, .2, 1); transform-style: preserve-3d; }
.flip.is-flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 28px; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface-2); border: 1px solid var(--border-strong); gap: 12px; }
.flip-face p { font-size: 19px; line-height: 1.5; max-width: 46ch; margin: 0; }
.flip-back { transform: rotateY(180deg); background: linear-gradient(160deg, var(--primary-soft), var(--surface-2)); }
.flip-back .flip-q { font-size: 13px; }
.flip-tag { font-size: 12px; font-weight: 700; color: var(--primary); }
.study-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.study-actions > .btn { grid-column: 1 / -1; }
.grade { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface-2); cursor: pointer; position: relative; }
.grade b { font-size: 15px; }
.grade span { font-size: 12px; color: var(--muted); }
.grade kbd { position: absolute; top: 6px; right: 6px; font-size: 10px; padding: 0 4px; }
.grade-danger:hover { border-color: var(--danger); background: var(--danger-soft); }
.grade-warn:hover { border-color: var(--warning); background: var(--warning-soft); }
.grade-ok:hover { border-color: var(--success); background: var(--success-soft); }
.grade-primary:hover { border-color: var(--primary); background: var(--primary-soft); }
.study-end { text-align: center; padding: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.study-end > .ic { width: 44px; height: 44px; color: var(--success); }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.notes li > div:first-child { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.note-actions { display: flex; gap: 4px; align-items: center; }
.steps { display: flex; gap: 4px; }
.steps i { width: 18px; height: 4px; border-radius: 3px; background: var(--ring-track); }
.steps i.on { background: var(--success); }
.note-review h3 { font-size: 20px; margin-bottom: 10px; }
.reveal { margin: 14px 0; padding: 16px; border-radius: 12px; background: var(--surface-2); }
.reveal h4 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-family: var(--font-ui); }
pre.code { background: var(--bg); padding: 12px; border-radius: 10px; overflow-x: auto; font: 13px/1.5 var(--mono); border: 1px solid var(--border); }

/* ---------- biblioteca ---------- */
.lib-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.lib-tools .input-sm { width: auto; }
.search { position: relative; flex: 1; min-width: 220px; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
.search .input { padding-left: 38px; height: 38px; }
.mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 14px; }
.mat { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border); }
.mat.st-concluido { border-color: color-mix(in srgb, var(--success) 40%, transparent); }
.mat header { display: flex; justify-content: space-between; align-items: center; }
.mat-cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mat-cat .ic { width: 15px; height: 15px; }
.mat h3 { font-size: 15px; }
.mat h3 a { color: var(--text); }
.mat p { margin: 0; flex: 1; }
.mat footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.mat footer .input-sm { width: auto; }
.mat-mods { display: flex; flex-direction: column; gap: 6px; }
.mat-notes { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); color: var(--muted); margin: 4px 0 0; }
.mat-notes .ic { width: 15px; height: 15px; margin-top: 2px; }
.checklist { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checklist li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 9px; }
.checklist li:hover { background: var(--surface-2); }
.checklist li .check { flex: 1; }
.checklist em { font-style: normal; }
.books { display: flex; flex-direction: column; gap: 14px; }
.book { display: flex; gap: 18px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border); }
.book.is-done { border-color: color-mix(in srgb, var(--success) 40%, transparent); }
.book-spine { width: 64px; min-height: 120px; border-radius: 6px 10px 10px 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--g) 70%, #000) 0 8px, var(--g) 8px); display: flex; align-items: flex-end; padding: 8px 6px 8px 14px; color: #fff; font-family: var(--font-display); font-size: 10px; font-weight: 600; line-height: 1.2; flex: none; box-shadow: var(--shadow); overflow: hidden; }
.book-spine span { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.book-body { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.book-body header { display: flex; justify-content: space-between; gap: 12px; }
.book-body h3 { font-size: 16px; }
.book-prog { display: flex; flex-direction: column; gap: 6px; }
.book-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.book-actions .inline-form .input { width: 96px; flex: none; }

/* ---------- projetos ---------- */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.proj { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: border-color .15s, transform .15s; }
.proj:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.proj header { display: flex; justify-content: space-between; align-items: center; }
.proj p { margin: 0; flex: 1; }
.proj-prog { display: flex; flex-direction: column; gap: 5px; }
.chip-status.s-andamento { background: var(--warning-soft); color: var(--warning); }
.chip-status.s-concluido { background: var(--success-soft); color: var(--success); }
.chip-status.s-publicado { background: var(--primary-soft); color: var(--primary); }
.portfolio { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.pf-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); color: var(--text); }
.pf-item:hover { text-decoration: none; background: var(--surface-3); }
.pf-item > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tpl { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); }
.tpl p { margin: 0; }
.tpl .btn { align-self: flex-start; margin-top: auto; }
.pd { display: flex; flex-direction: column; gap: 16px; }
.pd-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pd-field { display: flex; flex-direction: column; gap: 6px; }
.pd-field p { margin: 0; white-space: pre-wrap; }

/* ---------- conquistas ---------- */
.level-hero { display: flex; align-items: center; gap: 24px; }
.level-hero > div:last-child { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.level-hero h2 { font-size: 24px; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.ach { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border); }
.ach h3 { font-size: 15px; }
.ach p { margin: 0; flex: 1; }
.ach-ic { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; }
.ach-ic .ic { width: 24px; height: 24px; }
.ach.on .ach-ic { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; box-shadow: 0 12px 26px -12px var(--primary); }
.ach.off .ach-ic { background: var(--surface-2); color: var(--faint); filter: grayscale(1); }
.ach.off h3, .ach.off p { opacity: .6; }
.ach-date { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); font-weight: 600; }
.ach-date .ic { width: 14px; height: 14px; }

/* ---------- conta (versão GitHub) ---------- */
.login-banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 18px; border-radius: var(--r-lg); background: var(--secondary-soft); border: 1px solid color-mix(in srgb, var(--secondary) 30%, transparent); flex-wrap: wrap; }
.login-banner > .ic { color: var(--secondary); width: 22px; height: 22px; }
.login-banner > div { flex: 1; display: flex; flex-direction: column; min-width: 200px; }
.auth-links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ic-inline { width: 15px; height: 15px; vertical-align: -3px; margin-right: 6px; color: var(--success); }

/* ---------- configurações ---------- */
.settings .panel { margin-bottom: 0; }
.sync-line { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
.sync-line.sync-synced .ic { color: var(--success); }
.sync-line.sync-error .ic, .sync-line.sync-offline .ic { color: var(--warning); }
.imp-ok { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--success-soft); }
.imp-ok > p { display: flex; gap: 8px; align-items: center; font-weight: 600; }

/* ---------- modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.modal-backdrop { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .2s; backdrop-filter: blur(3px); }
.modal { position: relative; width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); transform: translateY(10px) scale(.98); opacity: 0; transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
.modal-wrap.in .modal-backdrop { opacity: 1; }
.modal-wrap.in .modal { transform: none; opacity: 1; }
.modal-sm { width: min(420px, 100%); }
.modal-lg { width: min(820px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px 22px; }
.modal-head h2 { font-size: 18px; }
.modal-body { padding: 4px 22px 22px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 95; display: flex; flex-direction: column; gap: 10px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); font-size: 14px; pointer-events: auto; transform: translateY(12px); opacity: 0; transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .25s; }
.toast.in { transform: none; opacity: 1; }
.toast > .ic { margin-top: 1px; }
.toast-body { flex: 1; display: flex; flex-direction: column; }
.toast-success > .ic { color: var(--success); }
.toast-warn > .ic, .toast-error > .ic { color: var(--warning); }
.toast-error > .ic { color: var(--danger); }
.toast-info > .ic { color: var(--secondary); }
.toast-xp > .ic { color: var(--warning); }
.toast-achievement { border-color: var(--primary); }
.toast-achievement > .ic { color: var(--primary); }

/* ---------- folha "Mais" (celular) ---------- */
.sheet { position: fixed; inset: 0; z-index: 65; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .2s; }
.sheet.open .sheet-backdrop { opacity: 1; }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1); }
.sheet.open .sheet-panel { transform: none; }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 4px auto 14px; }
.sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sheet-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 14px; background: var(--surface-2); color: var(--text); font-size: 12px; font-weight: 600; text-align: center; }
.sheet-item:hover { text-decoration: none; }
.sheet-item .ic { width: 22px; height: 22px; color: var(--primary); }

/* ---------- responsivo ---------- */
@media (max-width: 1180px) {
  .grid-pomo { grid-template-columns: 1fr; }
  .week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dims { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
  .grid-2, .grid-hero { grid-template-columns: 1fr; }
  .diag { grid-template-columns: 1fr; }
  .track-stats > div:nth-child(3) { display: none; }

}

  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 58px; margin: 0 -16px 14px; padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .top-level { display: flex; align-items: center; gap: 10px; }
  .xp-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 4px; border-radius: 99px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .xp-chip span { color: var(--muted); font-size: 12px; }

  .bn-item .ic { width: 22px; height: 22px; }

  .bn-item .nav-b { position: absolute; top: 4px; left: 50%; margin-left: 6px; }
  .bn-item .nav-badge { min-width: 17px; height: 17px; font-size: 10px; padding: 0 4px; }

  h1 { font-size: 24px; }

  .panel { padding: 16px; border-radius: 14px; margin-bottom: 14px; }
  .grid-2, .grid-hero, .stack { gap: 14px; }
  .grid-2, .grid-hero { margin-bottom: 14px; }
  .mission { padding: 18px; }
  .mission-title { font-size: 20px; }
  .kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px; }
  .kpi { padding: 12px 14px; gap: 10px; }
  .kpi-ic { display: none; }
  .kpi-value { font-size: 18px; white-space: normal; }
  .page-head { margin-bottom: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; }
  .task-actions { opacity: 1; }
  .topic { grid-template-columns: minmax(0, 1fr) 130px auto; }
  .topic .pips { display: none; }
  .track-head { gap: 12px; padding: 14px; }
  .track-stats { gap: 14px; }
  .track-stats > div:nth-child(2) { display: none; }
  .mday { min-height: 64px; padding: 4px; }
  .mday-tasks i { font-size: 0; height: 4px; padding: 0; border-left: 0; background: var(--c); }
  .mday-min { font-size: 9px; padding: 0 3px; }
  .donut { flex-direction: column; align-items: stretch; }
  .donut svg { align-self: center; }
  .modal-wrap { padding: 0; place-items: end stretch; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
  .modal, .modal-lg, .modal-sm, .modal.modal-study { width: 100%; border-radius: 20px 20px 0 0; max-height: 100%; padding-bottom: env(safe-area-inset-bottom, 0px); }

  .drawer.open .drawer-panel { transform: none; }

  .hist li { grid-template-columns: 50px 54px 1fr; }
  .seg button { min-width: 0; flex: 1 1 30%; padding: 8px 6px; }
  .sess-row { grid-template-columns: 10px minmax(0, 1fr) auto 34px; }
  .sess-row em { display: none; }
  .kpi-row { grid-template-columns: 1fr; }
  .hm-scale { display: none; }
  .lib-tools .input-sm { flex: 1 1 40%; }
  /* árvore: camadas empilhadas, sem mapa gigante */
  .tree-wrap { padding: 14px; overflow: visible; }

  .next-unlock { flex-wrap: wrap; }

  .next-unlock .btn { width: 100%; }
  .tier { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tier-label { grid-column: 1 / -1; padding-top: 6px; border-top: 1px solid var(--border); }
  .tier:first-child .tier-label { border-top: 0; padding-top: 0; }
  .node { width: 100%; padding: 10px; gap: 10px; }
  .node-ic { width: 28px; height: 28px; }
  .node-body b { font-size: 13px; }
  .tree-lines { display: none; }
}
@media (max-width: 440px) {

}
@media (max-width: 420px) {

}
@media print {
  .side, .bottom, .topbar, .toasts, .timer-float { display: none !important; }
  .main { margin: 0; padding: 0; }
}

const DAY_MS = 864e5;
function dayKey(d = new Date()) { d = d instanceof Date ? d : new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDay(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfDay(d = new Date()) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function startOfWeek(d = new Date()) { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const todayKey = () => dayKey(new Date());
const weekKey = (d) => dayKey(startOfWeek(d));
function monthKey(d = new Date()) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS); }
function fmtMin(min) {
  min = Math.round(min || 0);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}h ${pad(m)}min` : `${h}h`;
}
const fmtHours = (min, d = 1) => `${nf((min || 0) / 60, d)} h`;
function fmtDateLong(d) { d = d instanceof Date ? d : (typeof d === 'string' && d.length === 10 ? parseDay(d) : new Date(d)); return `${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}`; }
function fmtDateShort(d) { d = d instanceof Date ? d : (typeof d === 'string' && d.length === 10 ? parseDay(d) : new Date(d)); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }
function fmtTime(d) { d = new Date(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
function relDay(k) {
  const n = daysBetween(parseDay(k), new Date());
  if (n === 0) return 'hoje'; if (n === 1) return 'ontem'; if (n === -1) return 'amanhã';
  if (n > 1 && n < 7) return `há ${n} dias`;
  return fmtDateShort(k);
}
